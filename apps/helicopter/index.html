<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Helicopter — Becknology</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/bridge/js/shared/progression.js"></script>
<script src="/bridge/js/shared/together-frame.js"></script>
<script src="/bridge/js/shared/arcade-kit.js"></script>
</head>
<body>
<script>
/**
 * Helicopter — a cabinet in the Arcade in Arcadia (BridgeArcade kit,
 * apps/bridge/js/shared/arcade-kit.js). 320×180 native: one button climbs,
 * let go and it drops, through a gap under the city between neon-trimmed
 * walls, with the District's towers, smog and moon going by behind. The gap
 * narrows (110 → 55 px) and the scroll speeds up (72 → 150 px/s) as you go,
 * pillars stand in the way from 300 m, credit chips are +5 each, a marker
 * every 100 m, 2 coins every 250 m and coins for the score at the end.
 *
 * Everything is in native pixels and seconds, so it plays the same at any
 * screen size. The cave is generated a pixel column at a time, its slope
 * limited by what the craft can follow and flattened under every pillar, so
 * there is always a way through (checked by `game._sim`: a bot that flies
 * the demo on the title screen, and a search over every reachable height).
 *
 * Played together (js/shared/together-frame.js), the cave comes from the
 * session's seed (`cr`, its own random stream, so sparks and smoke never
 * change it) and the two craft swap where they are a dozen times a second:
 * in a score duel your rival flies beside you as a ghost; in tandem it's one
 * cave for two — crash and you relaunch beside your partner while they're
 * still flying, and the run's over when you're both down.
 */
(function () {
  var W = 320, H = 180, P = BridgeArcade.PAL.arcadia;
  var GLASS = '#181a40', HAZE = '#2a2240';          // Arcadia's smoked glass and floor tones (apps/bridge/CLAUDE.md)

  // ---- tuning -----------------------------------------------------------------------------------
  var PXM = 6,                                      // px of cave to the metre
      CRAFT_X = 64,                                 // the craft's screen column
      GRAV = 430, THRUST = 900,                     // px/s²: let go and it drops, hold and it climbs (net 470 up)
      MAX_UP = 125, MAX_DOWN = 150,                 // px/s
      SPEED0 = 72, SPEED1 = 150, SPEED_M = 2000,    // scroll px/s, rising from 0 m to SPEED_M
      GAP0 = 110, GAP1 = 55, GAP_M = 1400,          // the gap's height, closing from 0 m to GAP_M
      PILLAR_M = 300, PASS = 30,                    // pillars from 300 m, always a way past PASS px tall
      TOP_MIN = 14, BOT_MAX = H - 10,               // the gap stays between these rows
      CHIP_PTS = 5, AWARD_M = 250, AWARD = 2,
      RING = 1024, MASK = RING - 1;                 // cave columns kept (a ring, by world x)

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function k01(m, span) { return clamp(m / span, 0, 1); }
  function speedAt(m) { return SPEED0 + (SPEED1 - SPEED0) * k01(m, SPEED_M); }
  function gapAt(m) { return GAP0 - (GAP0 - GAP1) * k01(m, GAP_M); }
  function slopeMax(m) { return Math.min(0.22 + 0.28 * k01(m, 1000), 70 / speedAt(m)); }   // ≤ 70 px/s of climb to follow it
  function rnd(a, b) { return a + Math.random() * (b - a); }
  // the cave's own randomness: the session's seed when played together, so both pilots fly the same cave
  function cr() { return S && S.crand ? S.crand() : Math.random(); }
  function crnd(a, b) { return a + cr() * (b - a); }
  var TF = window.BridgeTogetherFrame || null, TANDEM = !!(TF && TF.cfg.mode === 'tandem');
  function tlive() { return !!(TF && !TF.over && S && !S.demo && S.together); }
  var mate = null;                                  // the other craft: where they are, as they last said
  if (TF) TF.on('data', function (m) {
    if (m.k === 'chip' && m.d && S && S.together) {   // tandem: a chip your partner took is gone for you too
      S.chips = S.chips.filter(function (c) { return !(c.x === m.d.x && c.y === m.d.y); });
      return;
    }
    if (m.k !== 'heli' || !m.d) return;
    var d = m.d, t = performance.now();
    if (!mate) mate = { scroll: d.s, y: d.y, ty: d.y, ts: d.s, tilt: 0 };
    mate.ts = d.s; mate.ty = d.y; mate.tilt = d.t || 0; mate.crashed = !!d.c; mate.at = t; mate.speed = d.v || 0; mate.out = !!d.o;
  });

  var FIRE = [P.white, P.yel, P.yel, P.pink, P.red, P.mag, P.purp2],
      SMOKE = [P.grey, P.hi, P.hi, P.mid, P.mid, P.bg2],
      EXHAUST = [P.grey, P.hi, P.mid],
      WASH = [P.hi, P.mid],
      SPRAY = [P.cyan2, P.cyan, P.cyan, GLASS],
      DRIP = [P.cyan2, P.cyan2, P.cyan],
      SPARK = [P.white, P.yel, P.yel, P.pink];

  var S = null;                                     // the world: a run, or the title screen's demo
  var best = { m: 0, score: 0 };
  function loadBestM() { try { return +localStorage.getItem('bridge_helicopter_m') || 0; } catch (e) { return 0; } }
  function saveBestM(m) { try { localStorage.setItem('bridge_helicopter_m', String(m)); } catch (e) { /* private mode */ } }

  function newWorld(demo) {
    var c = (TOP_MIN + BOT_MAX) / 2;
    var together = !demo && !!TF && !TF.over;
    S = {
      demo: demo, T: S ? S.T : 0, scroll: 0, speed: SPEED0, dist: 0, together: together, crand: together ? TF.rng('cave') : null,
      shield: 0, sendT: 0, relaunches: 0,
      y: c, vy: 0, tilt: 0,
      crashed: false, crashT: 0, overSent: false, cause: '', wreck: null, ring: null, blade: null,
      top: new Int16Array(RING), bot: new Int16Array(RING),
      gen: { x: -16, c: c, s: 0, target: c, travel: 0, calmTo: -1, flatFrom: 1e9, flatTo: -1, flatGap: GAP0,
             pending: null, lastPillar: 0, pillarGap: 0, notch: null, notchCd: 90, chipCd: 120, trail: 0, trailOff: 0, trailCd: 0 },
      pillars: [], chips: [], parts: [], pops: [],
      got: 0, nextMile: 100, nextAward: AWARD_M, passedBest: false,
      flut: 0, exT: 0, washT: 0, dripT: 0.5
    };
    generate();
  }

  // ---- the cave: one pixel column at a time, ahead of the screen -----------------------------------
  function generate() {
    var need = Math.floor(S.scroll) + W + 160;
    while (S.gen.x < need) genColumn();
  }

  function genColumn() {
    var G = S.gen, x = G.x, m = (x - CRAFT_X) / PXM;
    var warm = x < CRAFT_X + 200;                   // a straight run in at the start
    var flat = x >= G.flatFrom && x <= G.flatTo;    // level under a pillar
    var calm = x <= G.calmTo;
    var gap = flat ? G.flatGap : gapAt(m);
    var smax = slopeMax(m), ds = 0.004 + 0.004 * k01(m, 1200);
    var cMin = TOP_MIN + gap / 2, cMax = BOT_MAX - gap / 2, want = 0;
    if (!warm && !calm) {
      if (Math.abs(G.target - G.c) < 2 || ++G.travel > 520) { G.target = crnd(cMin, cMax); G.travel = 0; }
      var d = G.target - G.c;                       // head for the target, easing off in time to level out there
      want = clamp((d < 0 ? -1 : 1) * Math.sqrt(2 * ds * Math.abs(d)) * 0.9, -smax, smax);
    }
    G.s += clamp(want - G.s, -(calm ? ds * 3 : ds), calm ? ds * 3 : ds);
    if (flat) G.s = 0;
    G.c = clamp(G.c + G.s, cMin, cMax);
    var t = Math.round(G.c - gap / 2), b = Math.round(G.c + gap / 2);

    // notches: girders hung from the ceiling, plant on the floor — shallow, and fewer as it closes in
    if (!warm && !calm) {
      if (G.notch) { if (G.notch.top) t += G.notch.d; else b -= G.notch.d; if (--G.notch.n <= 0) G.notch = null; }
      else if (--G.notchCd <= 0) {
        G.notch = { top: cr() < 0.5, d: clamp(Math.round((gap - 46) / 4), 2, 6), n: 5 + Math.floor(cr() * 14) };
        G.notchCd = 50 + cr() * 130;
      }
    } else G.notch = null;

    // pillars: decided 70 px ahead, so the cave can level out before one
    if (!warm && !G.pending && m >= PILLAR_M - 12 && x - G.lastPillar >= G.pillarGap) {
      var pw = 8 + 2 * Math.floor(cr() * 3);
      G.pending = { x: x + 70, w: pw };
      G.calmTo = x + 70 + pw + 30;
      G.flatFrom = x + 40; G.flatTo = x + 70 + pw + 12; G.flatGap = Math.round(gapAt(m + 70 / PXM));
      G.trail = 0;
    }
    if (G.pending && x === G.pending.x) makePillar(x, G.pending.w, t, b, m);

    // credit chips: singles, and now and then a short line of them
    if (!warm && !G.pending && !calm) {
      if (G.trail > 0) {
        if (--G.trailCd <= 0) { addChip(x, clamp(G.c + G.trailOff, t + 7, b - 7)); G.trail--; G.trailCd = 14; }
      } else if (--G.chipCd <= 0) {
        if (cr() < 0.25) { G.trail = 3 + Math.floor(cr() * 2); G.trailOff = crnd(-1, 1) * (gap / 2 - 14); G.trailCd = 0; }
        else addChip(x, clamp(G.c + crnd(-1, 1) * (gap / 2 - 10), t + 7, b - 7));
        G.chipCd = 160 + cr() * 160;
      }
    }
    S.top[x & MASK] = t; S.bot[x & MASK] = b;
    G.x++;
  }

  function makePillar(x, w, t, b, m) {
    var G = S.gen, gap = b - t, p = { x: x, w: w, kind: 'mid', y0: 0, y1: 0, ph: cr() * 6 };
    var ph = clamp(Math.round(gap * 0.24), 12, 26), room = gap - ph, a;
    if (room >= PASS + 12 && cr() < 0.55) {                        // floating in the middle: PASS one side, 12+ the other
      a = cr() < 0.5 ? 12 + Math.floor(cr() * (room - PASS - 11)) : PASS + Math.floor(cr() * (room - PASS - 11));
      p.y0 = t + a; p.y1 = p.y0 + ph;
    } else {                                                        // hung from the ceiling or stood on the floor
      var pass = clamp(Math.round(gap * 0.55), PASS + 2, 50);
      if (cr() < 0.5) { p.kind = 'up'; p.y0 = t - 6; p.y1 = b - pass; }
      else { p.kind = 'down'; p.y0 = t + pass; p.y1 = b + 6; }
    }
    S.pillars.push(p);
    if (cr() < 0.5) {                                               // a chip in the way through
      var above = p.kind === 'up' ? false : p.kind === 'down' ? true : p.y0 - t >= b - p.y1;
      addChip(x + (w >> 1), above ? (t + p.y0) / 2 : (p.y1 + b) / 2);
    }
    G.lastPillar = x;
    G.pillarGap = Math.round(440 - 210 * k01(m - PILLAR_M, 1200) + cr() * 140);
    G.pending = null;
  }

  function addChip(x, y) { S.chips.push({ x: x, y: Math.round(y), ph: cr() * 6 }); }

  // the craft's box: columns -6..6 round its centre, rows y-3..y+4 (the rotor tips may brush the neon)
  function collideAt(sx, y) {
    var cx = sx + CRAFT_X, ry = Math.round(y), i;
    for (i = -6; i <= 6; i++) {
      if (ry - 3 < S.top[(cx + i) & MASK]) return 'ceiling';
      if (ry + 4 >= S.bot[(cx + i) & MASK]) return 'floor';
    }
    for (i = 0; i < S.pillars.length; i++) {
      var p = S.pillars[i];
      if (cx + 6 >= p.x && cx - 6 < p.x + p.w && ry + 4 >= p.y0 && ry - 3 < p.y1) return 'pillar';
    }
    return '';
  }

  // ---- the demo pilot (title screen, and the simulation) -----------------------------------------
  function autopilot() {
    var cx = Math.floor(S.scroll) + CRAFT_X, lo = -1e9, hi = 1e9, i, look = Math.max(18, Math.round(S.speed * 0.3));
    for (i = -6; i <= look; i++) {
      lo = Math.max(lo, S.top[(cx + i) & MASK] + 3);
      hi = Math.min(hi, S.bot[(cx + i) & MASK] - 5);
    }
    var target = (lo + hi) / 2;
    for (i = 0; i < S.pillars.length; i++) {
      var p = S.pillars[i];
      if (p.x + p.w + 8 < cx || p.x > cx + S.speed * 0.9 + 24) continue;
      var t = S.top[p.x & MASK], b = S.bot[p.x & MASK];
      var aLo = t + 3, aHi = p.y0 - 5, bLo = p.y1 + 3, bHi = b - 5;
      if (p.way == null) p.way = (aHi - aLo) >= (bHi - bLo) ? 0 : 1;           // over or under: the roomier
      var l2 = Math.min(lo + 3, (lo + hi) / 2), h2 = Math.max(hi - 3, (lo + hi) / 2);
      target = clamp(p.way ? (bLo + bHi) / 2 : (aLo + aHi) / 2, l2, h2);   // line up, but not through a wall
      break;
    }
    var tau = 0.14;
    return S.y + S.vy * tau + 0.5 * GRAV * tau * tau > target;
  }

  // ---- a step of play ------------------------------------------------------------------------------
  function stepRun(api, dt, climb) {
    var live = !S.demo;
    if (!S.crashed) {
      S.speed = speedAt(S.dist);
      S.vy = clamp(S.vy + (GRAV - (climb ? THRUST : 0)) * dt, -MAX_UP, MAX_DOWN);
      S.y += S.vy * dt;
      S.scroll += S.speed * dt;
      S.dist = S.scroll / PXM;
      generate();
      S.tilt += (clamp(-S.vy / 50, -2, 2) - S.tilt) * Math.min(1, dt * 10);
      emit(dt, climb);
      pickChips(api);
      if (S.shield > 0) {                           // just relaunched: a moment to find your feet (blinking, no crashing)
        S.shield -= dt;
        var cx0 = (Math.floor(S.scroll) + CRAFT_X) & MASK;
        S.y = clamp(S.y, S.top[cx0] + 4, S.bot[cx0] - 5);
      }
      var why = S.shield > 0 ? '' : collideAt(Math.floor(S.scroll), S.y);
      if (why) crash(api, why);
      else milestones(api);
      if (live) {
        api.score = Math.floor(S.dist) + S.got * CHIP_PTS;
        if (climb) { if ((S.flut -= dt) <= 0) { S.flut = 0.075; api.noise(0.045, 0.03, 480); } }   // the rotor's chop
        else S.flut = 0;
      }
    } else {
      S.crashT += dt;
      if (live && TANDEM && tlive()) tandemDown(api);
      else if (live && !S.overSent && S.crashT >= 1.1) { S.overSent = true; api.over(); }
    }
    stepAmbient(dt);
    if (live && tlive()) share(dt);
  }

  // ---- together: where you are, out to the other craft; the tandem relaunch ----------------------------
  function share(dt) {
    if ((S.sendT -= dt) > 0) return;
    S.sendT = 1 / 12;
    TF.send('heli', { s: Math.round(S.scroll * 10) / 10, y: Math.round(S.y * 10) / 10, t: Math.round(S.tilt * 10) / 10, c: S.crashed ? 1 : 0, v: Math.round(S.speed), o: S.overSent ? 1 : 0 });
  }
  function mateFlying() { return !!(mate && !mate.crashed && !mate.out && performance.now() - mate.at < 2500 && !(TF.peer && TF.peer.done)); }
  function tandemDown(api) {
    if (S.overSent || S.crashT < 1.1) return;
    if (!mateFlying()) {                           // both down (or they've gone): the run's over for you both
      if (S.crashT >= 1.6) { S.overSent = true; share(1); api.over(); }
      return;
    }
    if (S.crashT >= 2.6) relaunch(api);
  }
  function relaunch(api) {
    var age = (performance.now() - mate.at) / 1000, to = mate.ts + (mate.speed || S.speed) * Math.min(age, 0.5);
    S.scroll = Math.max(S.scroll, to);
    S.dist = S.scroll / PXM;
    S.speed = speedAt(S.dist);
    generate();
    var sx = Math.floor(S.scroll), cx = (sx + CRAFT_X) & MASK;
    S.pillars = S.pillars.filter(function (p) { return p.x + p.w >= sx - 12; });
    S.chips = S.chips.filter(function (c) { return c.x >= sx - 12; });
    var mid = (S.top[cx] + S.bot[cx]) / 2;            // beside them, not on top of them: toward the middle of the gap
    S.y = clamp(mate.ty + (mate.ty < mid ? 13 : -13), S.top[cx] + 6, S.bot[cx] - 7);
    S.vy = 0; S.tilt = 0; S.crashed = false; S.crashT = 0; S.wreck = null; S.blade = null; S.ring = null; S.shield = 1.6;
    S.relaunches++;
    S.nextMile = Math.ceil(S.dist / 100) * 100; S.nextAward = Math.ceil(S.dist / AWARD_M) * AWARD_M;
    pop('BACK IN BESIDE ' + String(TF.cfg.vs || '').toUpperCase(), W / 2, 52, P.cyan2, { screen: true, life: 1.4, vy: -6 });
    api.beep(660, 0.1, 'triangle', 0.06); setTimeout(function () { api.beep(990, 0.16, 'triangle', 0.06); }, 90);
  }

  function emit(dt, climb) {
    var cx = S.scroll + CRAFT_X;
    if ((S.exT -= dt) <= 0) {                       // exhaust off the engine
      S.exT = climb ? 0.035 : 0.07;
      S.parts.push({ x: cx - 2, y: S.y - 2, vx: S.speed * 0.55, vy: rnd(-16, -6), life: 0.5, max: 0.5, ramp: EXHAUST });
    }
    if (climb && (S.washT -= dt) <= 0) {            // rotor wash, and spray off the floor when it's close
      S.washT = 0.03;
      S.parts.push({ x: cx + rnd(-7, 7), y: S.y + 5, vx: S.speed * 0.8, vy: rnd(90, 140), life: 0.16, max: 0.16, ramp: WASH });
      var b = S.bot[Math.floor(cx) & MASK];
      if (b - S.y < 32) for (var i = 0; i < 2; i++) {
        S.parts.push({ x: cx + rnd(-8, 8), y: b - 1, vx: S.speed * rnd(0.5, 1.2) + rnd(-20, 20), vy: rnd(-70, -25), g: 220, life: 0.35, max: 0.35, ramp: SPRAY });
      }
    }
  }

  function pickChips(api) {
    var sx = Math.floor(S.scroll), cx = sx + CRAFT_X;
    for (var i = S.chips.length - 1; i >= 0; i--) {
      var c = S.chips[i];
      if (c.x < sx - 12) { S.chips.splice(i, 1); continue; }
      if (Math.abs(c.x - cx) <= 8 && Math.abs(c.y - S.y) <= 7) {
        S.chips.splice(i, 1);
        S.got++;
        if (TANDEM && tlive()) TF.send('chip', { x: c.x, y: c.y });
        for (var k = 0; k < 7; k++) { var a = Math.random() * Math.PI * 2; S.parts.push({ x: c.x, y: c.y, vx: Math.cos(a) * 50 + S.speed * 0.6, vy: Math.sin(a) * 50, life: 0.3, max: 0.3, ramp: SPARK }); }
        if (!S.demo) {
          pop('+' + CHIP_PTS, c.x, c.y - 10, P.yel);
          api.beep(1320, 0.05, 'square', 0.035);
          setTimeout(function () { api.beep(1760, 0.09, 'square', 0.035); }, 55);
        }
      }
    }
  }

  function milestones(api) {
    if (S.demo) return;
    if (S.dist >= S.nextMile) {
      pop(S.nextMile + 'M', W / 2, 24, P.cyan2, { screen: true, scale: 2, life: 1.3, vy: -6 });
      api.beep(784, 0.08, 'triangle', 0.06);
      setTimeout(function () { api.beep(1175, 0.16, 'triangle', 0.06); }, 90);
      S.nextMile += 100;
    }
    if (S.dist >= S.nextAward) {
      api.award(AWARD, 'distance');
      pop('+' + AWARD + ' COINS', W / 2, 42, P.green, { screen: true, life: 1.5, vy: -6 });
      api.beep(988, 0.06, 'square', 0.04);
      setTimeout(function () { api.beep(1319, 0.06, 'square', 0.04); }, 70);
      setTimeout(function () { api.beep(1976, 0.12, 'square', 0.035); }, 140);
      S.nextAward += AWARD_M;
    }
    if (!S.passedBest && best.m >= 50 && S.dist >= best.m) {
      S.passedBest = true;
      pop('PAST YOUR BEST', S.scroll + CRAFT_X + 10, S.y - 14, P.yel, { life: 1.2 });
      api.beep(1047, 0.1, 'triangle', 0.05);
      setTimeout(function () { api.beep(1568, 0.18, 'triangle', 0.05); }, 100);
    }
  }

  function crash(api, why) {
    var x = S.scroll + CRAFT_X, y = S.y, i, a, v;
    S.crashed = true; S.crashT = 0; S.cause = why;
    for (i = 0; i < 48; i++) {                      // the fireball
      a = Math.random() * Math.PI * 2; v = rnd(30, 140);
      S.parts.push({ x: x, y: y, vx: Math.cos(a) * v + S.speed * 0.3, vy: Math.sin(a) * v - 20, g: 140, life: rnd(0.35, 1.05), max: 1.05, ramp: FIRE, floor: 0.3 });
    }
    for (i = 0; i < 9; i++) {                       // pieces of the craft
      S.parts.push({ x: x + rnd(-5, 5), y: y + rnd(-2, 3), vx: rnd(-50, 70) + S.speed * 0.3, vy: rnd(-150, -50), g: 330, life: rnd(1.4, 2.4), max: 2.4,
                     ramp: [P.pink, P.pink, P.mag, P.mag, P.mid], s: 2, floor: 0.45 });
    }
    for (i = 0; i < 12; i++) S.parts.push({ x: x + rnd(-4, 4), y: y + rnd(-3, 3), vx: rnd(-12, 12), vy: rnd(-34, -10), life: rnd(1, 2.2), max: 2.2, ramp: SMOKE, s: 2 });
    S.ring = { x: x, y: y, t: 0 };
    S.blade = { x: x, y: y - 4, vx: S.speed * 0.4 - 20, vy: rnd(-160, -120), a: 0, va: 18, done: false };
    S.wreck = { x: x, y: y, vy: Math.min(S.vy, 0) * 0.4 - 30, landed: false, smoke: 0 };
    if (!S.demo) {
      api.shake(7); api.flash(P.pink);
      api.noise(0.9, 0.3, 1300); api.beep(150, 0.6, 'sawtooth', 0.07, 0.25);
      if (Math.floor(S.dist) > loadBestM()) saveBestM(Math.floor(S.dist));
    }
  }

  // things that keep moving while the world does — and on the game-over screen, the fire and smoke
  function stepAmbient(dt) {
    S.T += dt;
    if (S.crashed) { S.speed *= Math.pow(0.03, dt); S.scroll += S.speed * dt; generate(); }
    stepParts(dt);
    stepWreck(dt);
    if ((S.dripT -= dt) <= 0) {                     // drips off the ceiling's edge
      S.dripT = rnd(0.25, 0.95);

    g.fillRect(x, y0, w, 1); g.fillRect(x, y0 + h - 1, w, 1); g.fillRect(x, y0, 1, h); g.fillRect(x + w - 1, y0, 1, h);
    g.fillStyle = P.cyan2; g.fillRect(x, y0 + ((Math.floor(T * 20 + p.ph * 10)) % h), 1, 2);   // a light running up the frame
    var on = (T + p.ph) % 1 < 0.5;
    g.fillStyle = on ? P.red : P.purp2;
    if (p.kind !== 'up') g.fillRect(x + (w >> 1) - 1, y0 - 2, 2, 2);
    if (p.kind !== 'down') g.fillRect(x + (w >> 1) - 1, y0 + h, 2, 2);
  }

  var CHIP = ['..yyy..', '.yoooy.', 'yocccoy', 'yocwcoy', 'yocccoy', '.yoooy.', '..yyy..'];
  var CHIPC = { y: P.yel, o: P.bg2, c: P.cyan, w: P.white };
  function drawChip(g, cx, cy, ph) {
    var a = Math.abs(Math.cos(ph)), w = a > 0.8 ? 7 : a > 0.5 ? 5 : a > 0.2 ? 3 : 1, x0 = cx - (w >> 1), y0 = cy - 3, i, r;
    if (w === 1) { g.fillStyle = P.yel; g.fillRect(cx, y0, 1, 7); return; }
    for (i = 0; i < w; i++) {
      var sc = Math.floor((i + 0.5) * 7 / w);
      for (r = 0; r < 7; r++) {
        var ch = CHIP[r][sc]; if (ch === '.') continue;
        g.fillStyle = (i === 0 || i === w - 1) && w < 7 ? P.yel : CHIPC[ch]; g.fillRect(x0 + i, y0 + r, 1, 1);
      }
    }
  }
  function drawChips(g, sx) {
    var T = S.T;
    S.chips.forEach(function (c) {
      var x = c.x - sx; if (x < -6 || x > W + 6) return;
      var y = c.y + (Math.sin(T * 3 + c.ph) > 0.3 ? -1 : 0);
      drawChip(g, x, y, T * 5 + c.ph);
      if ((T * 0.8 + c.ph) % 1.5 < 0.12) { g.fillStyle = P.white; g.fillRect(x + 4, y - 4, 1, 1); g.fillRect(x + 3, y - 5, 1, 1); g.fillRect(x + 5, y - 3, 1, 1); }
    });
  }
  function chipIcon(g, x, y) {
    g.fillStyle = P.bg; g.fillRect(x, y + 1, 6, 5);
    g.fillStyle = P.yel; g.fillRect(x + 1, y, 3, 1); g.fillRect(x + 1, y + 4, 3, 1); g.fillRect(x, y + 1, 1, 3); g.fillRect(x + 4, y + 1, 1, 3);
    g.fillStyle = P.cyan; g.fillRect(x + 1, y + 1, 3, 3);
    g.fillStyle = P.white; g.fillRect(x + 2, y + 2, 1, 1);
  }

  // the craft: 16×9, nose to the right; row 0 is the rotor, drawn live
  var HELI = [
    '................',
    'f........m......',
    'ff.....eobggo...',
    'fkkkkkkobbgGGgo.',
    '.f....obhbbggggo',
    '......obbbbbbbbo',
    '.......oddddddo.',
    '........s...s..s',
    '......ssssssss..'
  ];
  var HELIC = { o: P.bg, b: P.pink, d: P.mag, h: P.white, g: P.cyan, G: P.cyan2, k: P.mag, f: P.pink, m: P.grey, s: P.grey, e: P.hi };
  var ROTOR = [[2, 15], [5, 13], [8, 10], [5, 13]];
  function drawHeli(g, sx0, y, tilt, T) {
    var x0 = sx0 - 8, y0 = Math.round(y) - 4, tq = Math.round(tilt), c, r, col = null;
    function sh(cc) { return Math.round((8 - cc) * tq / 8); }        // tilt: shear the columns, nose up as it climbs
    function px(cc, rr, cl) { if (cl !== col) { g.fillStyle = cl; col = cl; } g.fillRect(x0 + cc, y0 + rr + sh(cc), 1, 1); }
    for (r = 1; r < 9; r++) for (c = 0; c < 16; c++) { var ch = HELI[r][c]; if (ch !== '.') px(c, r, HELIC[ch]); }
    var span = ROTOR[Math.floor(T * 30) % 4];
    for (c = span[0]; c <= span[1]; c++) px(c, 0, c - span[0] < 2 || span[1] - c < 2 ? P.grey : P.white);
    if (Math.floor(T * 36) % 2) { px(1, 1, P.grey); px(1, 3, P.grey); px(1, 2, P.white); } else { px(0, 2, P.grey); px(2, 2, P.grey); }
    px(0, 1, (T % 1) < 0.5 ? P.red : P.mag);                                    // tail light
    if ((T % 1.2) < 0.08) px(10, 6, P.white);                                   // belly strobe
    px(15, 5, P.yel);                                                           // nose light
  }

  function drawWreck(g, api, sx) {
    var w = S.wreck, T = S.T, i;
    if (S.ring) {
      var rx = Math.round(S.ring.x) - sx, ry = Math.round(S.ring.y);
      if (S.ring.t < 0.16) api.circle(g, rx, ry, S.ring.t < 0.07 ? 6 : 4, S.ring.t < 0.07 ? P.white : P.yel, true);   // the flash at its heart
      api.circle(g, rx, ry, 3 + S.ring.t * 70, S.ring.t < 0.15 ? P.yel : P.pink);
    }
    if (S.blade) {
      var bl = S.blade, ca = Math.cos(bl.a) * 4, sa = Math.sin(bl.a) * 4;
      api.line(g, bl.x - sx - ca, bl.y - sa, bl.x - sx + ca, bl.y + sa, P.grey);
    }
    if (!w) return;
    var x = Math.round(w.x) - sx, y = Math.round(w.y);
    g.fillStyle = P.bg; g.fillRect(x - 4, y - 1, 9, 3);
    g.fillStyle = P.mid; g.fillRect(x - 3, y - 1, 7, 2);
    g.fillStyle = P.hi; g.fillRect(x - 2, y - 1, 3, 1);
    for (i = -2; i <= 2; i++) {                     // flames
      var fh = Math.max(0, Math.round(2 + Math.sin(T * 17 + i * 1.9) * 1.6 + (i === 0 ? 1 : 0)));
      if (!fh) continue;
      g.fillStyle = P.red; g.fillRect(x + i, y - 1 - fh, 1, fh);
      g.fillStyle = P.yel; g.fillRect(x + i, y - 1 - Math.max(1, fh - 1), 1, 1);
    }
  }

  function drawParts(g, sx) {
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i], k = Math.min(p.ramp.length - 1, Math.floor((1 - p.life / p.max) * p.ramp.length));
      g.fillStyle = p.ramp[Math.max(0, k)];
      g.fillRect(Math.round(p.x) - sx, Math.round(p.y), p.s || 1, p.h || p.s || 1);
    }
  }

  function label(g, api, s, x, y, col, align, scale) {
    scale = scale || 1;
    api.text(g, s, x + scale, y + scale, scale > 1 ? P.mag : P.bg, scale, align);
    api.text(g, s, x, y, col, scale, align);
  }

  function drawPops(g, api, sx) {
    S.pops.forEach(function (p) {
      if (p.life - p.t < 0.3 && Math.floor(p.t * 16) % 2) return;
      var x = p.screen ? p.x : Math.round(p.x) - sx, y = Math.round(p.y + p.vy * p.t);
      label(g, api, p.text, x, y, p.col, 'center', p.scale);
    });
  }

  // the other craft: a ghost of your rival in a duel, your partner in tandem (in the other neon, with their name)
  function drawMate(g, api, sx, mode) {
    if (!mate || !S || S.demo || !S.together || mode === 'title') return;
    var t = performance.now(), age = Math.min(0.5, (t - mate.at) / 1000);
    if (t - mate.at > 4000) return;
    var want = mate.crashed ? mate.ts : mate.ts + (mate.speed || 0) * age;
    mate.scroll += (want - mate.scroll) * 0.35; mate.y += (mate.ty - mate.y) * 0.4;
    if (Math.abs(want - mate.scroll) > 120) mate.scroll = want;
    var x = Math.round(CRAFT_X + mate.scroll - S.scroll), y = Math.round(mate.y), name = String(TF.cfg.vs || '').toUpperCase();
    if (x < -10 || x > W + 10) {                    // off the screen: their name at the edge, pointing the way
      var ey = clamp(y, 24, H - 12);
      if (x < 0) label(g, api, '<' + name, 3, ey, mate.crashed ? P.grey : P.cyan2);
      else label(g, api, name + '>', W - 3, ey, mate.crashed ? P.grey : P.cyan2, 'right');
      return;
    }
    if (mate.crashed) { g.fillStyle = P.mid; g.fillRect(x - 3, y, 7, 2); label(g, api, name, x, y - 12, P.grey, 'center'); return; }
    g.save();
    if (!TANDEM) g.globalAlpha = 0.45;
    var keep = [HELIC.b, HELIC.d, HELIC.f, HELIC.k];
    HELIC.b = P.cyan; HELIC.d = P.purp; HELIC.f = P.cyan; HELIC.k = P.purp;
    drawHeli(g, x, mate.y, mate.tilt, S.T + 0.37);
    HELIC.b = keep[0]; HELIC.d = keep[1]; HELIC.f = keep[2]; HELIC.k = keep[3];
    g.restore();
    label(g, api, name, x, y - 13, TANDEM ? P.cyan2 : P.grey, 'center');
  }

  function drawHud(g, api, mode) {
    label(g, api, Math.floor(S.dist) + 'M', 5, 4, P.white);
    chipIcon(g, 5, 14);
    label(g, api, 'CHIPS ' + S.got, 13, 14, P.yel);
    label(g, api, 'SCORE ' + api.score, W - 5, 4, P.white, 'right');
    if (best.score) label(g, api, 'BEST ' + Math.max(best.score, api.score), W - 5, 14, P.grey, 'right');
    if (mode === 'over') label(g, api, Math.floor(S.dist) + 'M  +  ' + S.got + ' CHIPS', W / 2, 33, P.white, 'center');
    if (TANDEM && S.together && mode === 'play') {
      var nm = String(TF.cfg.vs || '').toUpperCase();
      if (S.crashed && mateFlying()) label(g, api, 'RELAUNCHING BESIDE ' + nm + '...', W / 2, 26, Math.floor(S.T * 4) % 2 ? P.cyan2 : P.white, 'center');
      else if (S.crashed) label(g, api, nm + ' IS DOWN TOO', W / 2, 26, P.pink, 'center');
      else if (mate && mate.crashed && performance.now() - mate.at < 2500) label(g, api, nm + ' IS DOWN - KEEP FLYING!', W / 2, 26, P.yel, 'center');
    }
  }

  // ---- the cabinet ------------------------------------------------------------------------------------
  var lastT = 0;
  var game = {
    id: 'helicopter', title: 'HELICOPTER', w: W, h: H, pal: 'arcadia',
    help: ['HOLD SPACE OR TAP TO CLIMB', 'LET GO TO DROP - CHIPS +5'],
    coins: { per: 50, best: 8 },

    start: function (api) {
      newWorld(false);
      best.m = loadBestM();
      best.score = (BridgeArcade.scores().helicopter || {}).best || 0;
    },

    attract: function (api, dt) {
      if (!S || !S.demo || (S.crashed && S.crashT > 2.2)) newWorld(true);
      stepRun(api, dt, !S.crashed && autopilot());
    },

    update: function (api, dt) {
      var climb = api.down(' ') || api.down('ArrowUp') || api.down('w') || api.down('W') || api.pointer.down;
      stepRun(api, dt, !!climb);
    },

    draw: function (g, api, mode) {
      if (!S) newWorld(true);
      if (!ART) buildArt(api);
      if (mode === 'over') stepAmbient(clamp(api.t - lastT, 0, 0.05));
      lastT = api.t;
      var sx = Math.floor(S.scroll);
      drawCity(g);
      drawWalls(g, sx);
      drawMarks(g, api, sx);
      S.pillars.forEach(function (p) { drawPillar(g, p, sx); });
      drawChips(g, sx);
      drawMate(g, api, sx, mode);
      if (!S.crashed && !(S.shield > 0 && Math.floor(S.T * 12) % 2)) drawHeli(g, CRAFT_X, S.y, S.tilt, S.T);
      drawWreck(g, api, sx);
      drawParts(g, sx);
      drawPops(g, api, sx);
      if (mode !== 'title') drawHud(g, api, mode);
    },

    // for tuning in Node: the world, a fresh one, the generator, the physics
    _sim: {
      state: function () { return S; }, reset: function (demo) { newWorld(demo); }, generate: function () { generate(); },
      collideAt: function (sx, y) { return collideAt(sx, y); }, autopilot: function () { return autopilot(); }, speedAt: speedAt, gapAt: gapAt,
      K: { GRAV: GRAV, THRUST: THRUST, MAX_UP: MAX_UP, MAX_DOWN: MAX_DOWN, PXM: PXM, CRAFT_X: CRAFT_X, MASK: MASK, W: W, H: H }
    }
  };

  BridgeArcade.run(game);

  // tap or hold anywhere: on a phone the thumbs rest in the margins beside the screen, so those fly too
  var cv = document.querySelector('canvas');
  document.addEventListener('pointerdown', function (e) {
    if (!cv || e.target === cv || (e.target.closest && e.target.closest('a'))) return;
    var ev;
    try { ev = new PointerEvent('pointerdown', { clientX: e.clientX, clientY: e.clientY, pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary, cancelable: true }); }
    catch (err) { return; }
    e.preventDefault();
    cv.dispatchEvent(ev);
  });
})();
</script>
</body>
</html>
