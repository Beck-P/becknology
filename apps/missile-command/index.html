<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Missile Command — Becknology</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/bridge/js/shared/progression.js"></script>
<script src="/bridge/js/shared/together-frame.js"></script>
<script src="/bridge/js/shared/arcade-kit.js"></script>
</head>
<body>
<script>
/**
 * Missile Command — HOLD THE BRINK (BridgeArcade kit, apps/bridge/js/shared/
 * arcade-kit.js). 320×240 native: the void round the Singularity, the black
 * hole burning at the top of the sky in its accretion disk, crystal shards
 * drifting, and on the last platform at the Brink six crystal spires and
 * three lens batteries between them, ten interceptors in each. What falls
 * are shards of the void. The
 * missiles come in salvos, more and faster every wave; MIRVs split from
 * wave 2, a corp gunship or a drone crosses from wave 3 dropping more. A
 * blast takes out whatever is inside it and that goes up too — chain
 * reactions, worth double. The silos are rebuilt and refilled every wave,
 * the bonus counts up after it (towers standing × 100, interceptors left
 * × 5), a tower comes back every 10,000 points and two every fifth wave.
 * Coins for each wave survived and for the score at the end.
 */
(function () {
  // the void's colours, under the names the drawing uses (BridgeArcade.PAL.void)
  var V = BridgeArcade.PAL.void, W = 320, H = 240, GY = 226;
  var P = { bg: V.bg, bg2: V.bg2, dark: V.dark, mid: V.mid, hi: V.hi, purp: V.purp, purp2: '#22163e', mag: V.deep, pink: '#f0a0e8',
            pink2: V.crys2, cyan: V.cyan, cyan2: '#c8f4ff', yel: V.gold, green: '#a8f0c8', red: V.red, white: V.white, grey: V.grey };
  var BAT_X = [20, 160, 300], BAT_V = [170, 250, 170];   // the middle silo's interceptors are quicker
  var CITY_X = [59, 90, 121, 199, 230, 261];
  var BOOM = [P.white, P.yel, P.pink, P.cyan2, P.purp, P.green, P.pink2, P.cyan];
  var FIRE = [P.red, P.yel, P.white, P.pink2];
  var GROW = 0.42, HOLD = 0.3, FADE = 0.5;              // a blast's life: swell, hang, shrink
  var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var MOON = { x: 252, y: 40, r: 9 };                   // the Singularity

  var A = null, live = false;                            // the kit's api; a real run, not the title's demo
  var cities = null, bats, foes, stubs, abms, blasts, fliers, bits, pops, chains, queue = [];
  var cross = { x: W / 2, y: 120 }, lastPx = -1, lastPy = -1, holdT = 0;
  var wave = 1, phase = 'intro', phaseT = 0, spawnLeft = 0, salvoT = 0, fliersLeft = 0, flierT = 0, tickT = 0;
  var bonus = null, intro = null, spare = 0, nextCity = 10000, hi = 0, endT = 0, blastId = 0, lastBoom = -1, demo = null;
  var bg = null, stars, wisps, traffic;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function seeded(s) { return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function dith(x, y, lvl) { return BAYER[(y & 3) * 4 + (x & 3)] < lvl; }

  // ---- sound (silent in the title's demo) --------------------------------------------------------
  function beep(f, d, type, vol, slide) { if (live) A.beep(f, d, type, vol, slide); }
  function noise(d, vol, f) { if (live) A.noise(d, vol, f); }
  function later(t, fn) { queue.push({ t: t, fn: fn }); }
  function tune(notes, step, type, vol) {
    notes.forEach(function (f, i) { later(i * step, function () { beep(f, step * 1.7, type || 'square', vol || 0.04); }); });
  }

  // ---- sprites ------------------------------------------------------------------------------------
  function sprite(g, rows, x, y, cols, flip) {
    var w = rows[0].length;
    for (var r = 0; r < rows.length; r++) {
      for (var i = 0; i < w; i++) {
        var col = cols[rows[r][flip ? w - 1 - i : i]];
        if (!col) continue;
        g.fillStyle = col; g.fillRect(x + i, y + r, 1, 1);
      }
    }
  }
  var RETICLE = ['cc..k..cc', 'c...k...c', '.........', '.........', 'kk..w..kk', '.........', '.........', 'c...k...c', 'cc..k..cc'];
  var GUNSHIP = ['....oooooo.......', '..oohhhhhhoooo...', '.ohhmmmmmmmmccoo.', 'opppppppppppppppo', '.oommmmmmmmmmmoo.', '...oyo.....oyo...', '....y.......y....'];
  var DRONE_A = ['......r......', '......o......', 'qqqq.ooo.qqqq', 'qcqcohhhocqcq', 'qqqqhmemhqqqq', 'qcqcohhhocqcq', 'qqqq.ooo.qqqq'];
  var DRONE_B = ['......r......', '......o......', '...q.ooo.q...', '...qohhhoq...', '...qhmemhq...', '...qohhhoq...', '...q.ooo.q...'];
  var MINI = ['.c.....', 'ccc..p.', 'mym.ppp', 'mmm.mym', 'mym.mmm', 'mmm.mym', 'mmmmmmm'];
  var ARROW = ['aaaaa', '.aaa.', '..a..'];
  var GUN_COLS = { o: P.bg, m: P.hi, h: P.grey, c: P.cyan2, p: P.pink, y: P.yel };
  var DRONE_COLS = { q: P.purp, c: P.cyan, o: P.grey, h: P.hi, m: P.mid, e: P.red, r: P.red };
  var MINI_COLS = { p: P.pink, c: P.cyan, m: P.hi, y: P.yel };

  // ---- the District's towers: six designs, the same every run ------------------------------------
  var TRIMS = [P.pink, P.cyan, P.purp, P.pink2, P.cyan2];
  function designCity(n) {
    var r = seeded(101 + n * 7919), towers = [], x = -11, top = 0;
    while (x <= 7) {
      var w = 3 + Math.floor(r() * 4);
      if (x + w > 11) w = 11 - x;
      if (w < 3) break;
      var mid = x + w / 2 > -6 && x + w / 2 < 6;
      var h = (mid ? 12 : 7) + Math.floor(r() * (mid ? 9 : 7));
      var tw = { x: x, w: w, h: h, trim: TRIMS[Math.floor(r() * TRIMS.length)], blocks: [], win: [], ant: h > 10 && r() < 0.55, band: null };
      if (w >= 5 && h >= 12 && r() < 0.7) tw.blocks.push({ x: x + 1, top: h, w: w - 2, n: 3 }, { x: x, top: h - 3, w: w, n: h - 3 });
      else tw.blocks.push({ x: x, top: h, w: w, n: h });
      tw.blocks.forEach(function (b) {
        for (var yy = 2; yy < b.n - 1; yy += 2) {
          for (var xx = 1; xx < b.w - 1; xx += 2) {
            if (r() < 0.55) {
              var k = r();
              tw.win.push({ x: b.x + xx, y: yy - b.top, col: k < 0.62 ? P.yel : k < 0.84 ? P.pink : P.cyan2, ph: r() * 11, fl: r() < 0.07 });
            }
          }
        }
      });
      var low = tw.blocks[tw.blocks.length - 1];
      if (low.n >= 9 && w >= 4 && r() < 0.45) tw.band = { y: 3 - low.top + 2 * Math.floor(r() * 2), col: r() < 0.5 ? P.pink : P.cyan, ph: r() * 13 };
      towers.push(tw);
      top = Math.max(top, h + (tw.ant ? 4 : 0));
      x += w + (r() < 0.3 ? 1 : 0);
    }
    var ruin = { cols: [], stumps: [], embers: [] };
    for (var i = -11; i <= 11; i++) ruin.cols.push(1 + Math.floor(r() * 2) + (Math.abs(i) < 7 ? Math.floor(r() * 3) : 0));
    for (i = 0; i < 2; i++) ruin.stumps.push({ x: -8 + Math.floor(r() * 14), w: 2 + Math.floor(r() * 2), h: 5 + Math.floor(r() * 5) });
    for (i = 0; i < 5; i++) ruin.embers.push({ x: -9 + Math.floor(r() * 19), y: 1 + Math.floor(r() * 3), ph: r() * 9 });
    return { towers: towers, top: top, ruin: ruin };
  }
  var DESIGNS = CITY_X.map(function (x, i) { return designCity(i); });

  // ---- the sky over the District, painted once ---------------------------------------------------
  function makeScenery(api) {
    bg = document.createElement('canvas'); bg.width = W; bg.height = H;
    var c = bg.getContext('2d'), r = seeded(42), x, y, i;
    function rgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    // night, smog thickening toward the street, the District's purple glow under it — dithered, never a gradient
    var img = c.createImageData(W, H), d = img.data, cNight = rgb(P.bg), cSmog = rgb(P.bg2), cGlow = rgb(P.purp2);
    for (y = 0; y < GY; y++) {
      var smog = clamp((y - 46) / 96, 0, 1) * 16, glow = clamp((y - 132) / 94, 0, 1) * 9;
      for (x = 0; x < W; x++) {
        var b = BAYER[(y & 3) * 4 + (x & 3)], col = b < glow ? cGlow : b < smog ? cSmog : cNight, o = (y * W + x) * 4;
        d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
      }
    }
    c.putImageData(img, 0, 0);
    // smog bands drifting across
    function band(y0, th, col, lvl, amp, fq, ph) {         // soft-edged, thicker and thinner along its length
      for (var bx = 0; bx < W; bx++) {
        var yc = y0 + Math.sin(bx * fq + ph) * amp, k = 0.6 + 0.4 * Math.sin(bx * fq * 2.3 + ph * 3);
        for (var by = Math.floor(yc - th); by <= Math.ceil(yc + th); by++) {
          var e = Math.abs(by - yc) / th;
          if (e < 1 && dith(bx, by, lvl * k * (1 - e * e))) { c.fillStyle = col; c.fillRect(bx, by, 1, 1); }
        }
      }
    }
    band(50, 3, P.bg2, 13, 1.5, 0.031, 0.4);
    band(70, 6, P.bg2, 9, 3, 0.017, 2.0);
    band(104, 7, P.purp2, 5, 3, 0.014, 1.3);
    band(130, 6, P.purp2, 7, 2, 0.021, 2.4);
    // the Singularity: a wide dithered glow, the accretion disk on the tilt (gold to white near), the black core
    for (y = -30; y <= 30; y++) for (x = -44; x <= 44; x++) {
      var gd = Math.sqrt(x * x / 1.8 + y * y);
      if (gd > 12 && gd < 30 && dith(MOON.x + x, MOON.y + y, Math.max(0, 9 - (gd - 12) / 2))) { c.fillStyle = gd < 18 ? V.deep : P.purp2; c.fillRect(MOON.x + x, MOON.y + y, 1, 1); }
    }
    for (var ang = 0; ang < Math.PI * 2; ang += 0.01) {
      for (var rr = 11; rr <= 21; rr++) {
        var ex = Math.round(MOON.x + Math.cos(ang) * rr * 1.6), ey = Math.round(MOON.y + Math.sin(ang) * rr * 0.42);
        var heat = 1 - (rr - 11) / 10;
        if (!dith(ex, ey, 4 + heat * 12)) continue;
        c.fillStyle = heat > 0.8 ? V.white : heat > 0.5 ? V.gold : heat > 0.25 ? '#e08a50' : V.red; c.fillRect(ex, ey, 1, 1);
      }
    }
    api.circle(c, MOON.x, MOON.y, MOON.r, '#000000', true);
    api.circle(c, MOON.x, MOON.y, MOON.r + 1, V.gold, false);                           // the photon ring
    for (x = -26; x <= 26; x++) {                                                        // the near side of the disk, across the core
      var hy = Math.round(MOON.y + 2 + Math.abs(x) * 0.08);
      if (Math.abs(x) < 34) { c.fillStyle = Math.abs(x) < 10 ? V.white : V.gold; c.fillRect(MOON.x + x, hy, 1, 1); }
    }
    // shards of the old world drifting: rock wedges with crystal growing on them, smaller and dimmer far off
    for (i = 0; i < 9; i++) {
      var sx = Math.floor(r() * W), sy = 90 + Math.floor(r() * 100), sw = 10 + Math.floor(r() * 22), sh = 6 + Math.floor(r() * 8), far = sy < 140;
      for (y = 0; y < sh; y++) {
        var half = Math.round(sw / 2 * (1 - y / sh));
        c.fillStyle = y === 0 ? (far ? P.mid : P.hi) : far ? P.dark : P.mid; c.fillRect(sx - half, sy + y, half * 2, 1);
      }
      for (var k2 = 0; k2 < 3; k2++) {                                                // crystals on top
        var cxx = sx - sw / 3 + Math.floor(r() * sw * 0.66), chh = 3 + Math.floor(r() * (far ? 5 : 9));
        for (y = 0; y < chh; y++) { c.fillStyle = far ? V.deep : y < 2 ? V.crys2 : V.crys; c.fillRect(Math.round(cxx), sy - y, y < chh - 1 ? 2 : 1, 1); }
      }
    }
    for (y = GY - 44; y < GY; y++) {
      var lv = (y - (GY - 44)) / 44 * 9;
      c.fillStyle = P.purp2;
      for (x = 0; x < W; x++) if (dith(x, y, lv)) c.fillRect(x, y, 1, 1);
    }
    // the platform's rim: worn stone, a line of runes still glowing in it
    c.fillStyle = P.dark; c.fillRect(0, GY, W, H - GY);
    c.fillStyle = V.crys2; c.fillRect(0, GY, W, 1);
    c.fillStyle = P.mid; c.fillRect(0, GY + 1, W, 1);
    c.fillStyle = V.deep;
    for (x = 3; x < W; x += 9) { c.fillRect(x, GY + 6, 3, 1); c.fillRect(x + 1, GY + 5, 1, 3); }

    stars = [];
    for (i = 0; i < 70; i++) {
      var s = { x: Math.floor(r() * W), y: Math.floor(r() * 124), b: r(), ph: r() * 10 };
      if (Math.hypot(s.x - MOON.x, s.y - MOON.y) > MOON.r + 4) stars.push(s);
    }
    wisps = [];
    for (i = 0; i < 4; i++) wisps.push({ x: r() * W, y: 48 + Math.floor(r() * 70), w: 36 + Math.floor(r() * 40), v: 2 + r() * 3 });
    traffic = [];                                                                      // echoes drifting past, faint
    for (i = 0; i < 6; i++) {
      var right = i % 2 === 0;
      traffic.push({ x: r() * W, y: [150, 158, 168][i % 3], v: (right ? 1 : -1) * (6 + r() * 9), col: right ? V.crys2 : V.cyan });
    }
  }

  // ---- the world --------------------------------------------------------------------------------
  function resetWorld() {
    cities = CITY_X.map(function (x, i) { return { x: x, i: i, alive: true, d: DESIGNS[i], rise: 1, flash: 0, smokeT: Math.random() }; });
    bats = BAT_X.map(function (x, i) { return { x: x, i: i, alive: true, ammo: 10, v: BAT_V[i] }; });
    foes = []; stubs = []; abms = []; blasts = []; fliers = []; bits = []; pops = []; chains = {}; queue = [];
  }

  function pop(s, x, y, col, life) {
    var p = { s: s, x: clamp(x, 34, W - 34), y: y, col: col, life: life || 1 };
    pops.push(p);
    return p;
  }
  function debris(x, y, col, sp) {
    var a = Math.random() * Math.PI * 2, v = sp * rnd(0.3, 1);
    bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, life: rnd(0.4, 0.9), col: col, grav: 120 });
  }

  function addScore(n) {
    if (!live) return;
    A.score += n;
    if (A.score >= nextCity) {
      nextCity += 10000; spare++;
      pop('BONUS SPIRE', W / 2, 30, P.green, 2.2);
      tune([784, 988, 1175, 1568], 0.08, 'square', 0.045);
    }
  }

  function foeSpeed() { return live ? Math.min(72, 12 + wave * 3.6) : 22; }
  function pickTarget() {
    var opts = [], tot = 0;
    cities.forEach(function (c) { opts.push({ x: c.x + rnd(-3, 3), y: GY - 1, w: c.alive ? 3 : 0.6 }); });
    bats.forEach(function (b) { opts.push({ x: b.x + rnd(-2, 2), y: GY - 16, w: b.alive ? 1.5 : 0.3 }); });
    opts.forEach(function (o) { tot += o.w; });
    var k = Math.random() * tot;
    for (var i = 0; i < opts.length; i++) { k -= opts[i].w; if (k <= 0) return opts[i]; }
    return opts[0];
  }
  function launchFoe(x, y, o) {
    o = o || {};
    var t = pickTarget(), sp = foeSpeed() * (o.fast || 1) * rnd(0.9, 1.1);
    var dx = t.x - x, dy = t.y - y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    var e = { sx: x, sy: y, x: x, y: y, tx: t.x, ty: t.y, vx: dx / d * sp, vy: dy / d * sp, stub: o.stub || null, ph: Math.random() * 2,
              split: o.mirv ? Math.min(t.y - 50, Math.max(y, 0) + rnd(55, 120)) : 0 };
    foes.push(e);
    return e;
  }
  function release(e) { if (e.stub) e.stub.kids--; }
  function split(e) {                                   // a MIRV comes apart; its trail stays while the warheads fly
    var n = 2 + (wave >= 6 && Math.random() < 0.4 ? 1 : 0), s = { sx: e.sx, sy: e.sy, x: e.x, y: e.y, kids: n };
    e.dead = true; release(e);
    stubs.push(s);
    for (var i = 0; i < n; i++) launchFoe(e.x, e.y, { stub: s });
    beep(1500, 0.09, 'square', 0.03, 0.4);
  }
  function salvo() {
    var n = Math.min(spawnLeft, 1 + Math.floor(Math.random() * Math.min(5, 1.6 + wave / 2)));
    for (var i = 0; i < n; i++) launchFoe(rnd(6, W - 6), -rnd(0, 6), { mirv: wave >= 2 && Math.random() < Math.min(0.32, 0.06 + wave * 0.035) });
    spawnLeft -= n;
    salvoT = Math.max(1.4, 4.6 - wave * 0.28) * rnd(0.8, 1.2);
    beep(880, 0.05, 'sine', 0.04); later(0.08, function () { beep(660, 0.07, 'sine', 0.035); });
  }
  function spawnFlier() {
    var left = Math.random() < 0.5, kind = (wave + fliersLeft) % 2 === 0 ? 'gunship' : 'drone';
    var v = kind === 'drone' ? 16 + wave * 0.8 : 24 + wave * 1.2;
    fliers.push({ kind: kind, x: left ? -12 : W + 12, y: 0, y0: 34 + Math.floor(Math.random() * 46), vx: left ? v : -v, t: 0,
                  dropT: rnd(1, 2), drops: 2 + Math.floor(wave / 3), humT: 0, hum: 0 });
  }

  function blast(x, y, max, kind, root) {
    var b = { x: x, y: y, r: 0, max: max, t: 0, kind: kind, harm: kind !== 'ground', id: blastId++ };
    b.root = root === undefined ? b.id : root;
    blasts.push(b);
    if (live && A.t - lastBoom > 0.06) {
      lastBoom = A.t;
      if (kind === 'ground') noise(0.7, 0.18, 380);
      else if (kind === 'abm') noise(0.45, 0.13, 1100);
      else { noise(0.35, 0.11, 1700); beep(190, 0.2, 'triangle', 0.04, 0.5); }
    }
    return b;
  }
  function inBlast(x, y, pad) {
    for (var i = 0; i < blasts.length; i++) {
      var b = blasts[i];
      if (!b.harm || b.r < 1) continue;
      var dx = x - b.x, dy = y - b.y, rr = b.r + pad;
      if (dx * dx + dy * dy <= rr * rr) return b;
    }
    return null;
  }
  function tally(root, x, y) {                          // a chain reaction from one interceptor
    var c = chains[root] = chains[root] || { n: 0, pop: null };
    c.n++;
    if (c.n >= 3 && live) {
      if (!c.pop || c.pop.life <= 0) c.pop = pop('', x, y, P.yel, 1.1);
      c.pop.s = 'CHAIN x' + c.n; c.pop.life = 1.1; c.pop.x = clamp(x, 34, W - 34); c.pop.y = clamp(y - 12, 24, GY - 40);
      beep(500 + c.n * 90, 0.09, 'square', 0.035);
    }
  }
  function kill(e, b) {
    e.dead = true; release(e);
    addScore((e.split ? 50 : 25) * (b.kind === 'abm' ? 1 : 2));
    blast(e.x, e.y, 11, 'chain', b.root);
    for (var i = 0; i < 5; i++) debris(e.x, e.y, i % 2 ? P.pink : P.yel, 40);
    tally(b.root, e.x, e.y);
  }
  function killFlier(f, b) {
    f.dead = true;
    var pts = 100 * (b.kind === 'abm' ? 1 : 2);
    addScore(pts);
    blast(f.x, f.y, 17, 'flier', b.root);
    for (var i = 0; i < 14; i++) debris(f.x, f.y, [P.pink, P.cyan2, P.hi, P.yel][i % 4], 60);
    if (live) pop(String(pts), f.x, f.y - 12, P.green, 1.2);
    beep(140, 0.5, 'sawtooth', 0.06, 0.3);
    tally(b.root, f.x, f.y);
  }
  function destroyCity(c) {
    c.alive = false; c.flash = 0;
    for (var i = 0; i < 18; i++) debris(c.x + rnd(-8, 8), GY - rnd(2, 14), [P.pink, P.cyan, P.yel, P.mid][i % 4], 70);
    noise(1.1, 0.24, 520); beep(330, 0.8, 'sawtooth', 0.06, 0.2);
    A.shake(5); A.flash(P.red);
    pop('SPIRE LOST', c.x, GY - 36, P.red, 1.3);
  }
  function destroyBat(b) {
    b.alive = false; b.ammo = 0;
    for (var i = 0; i < 12; i++) debris(b.x + rnd(-8, 8), GY - rnd(4, 14), [P.cyan, P.hi, P.yel][i % 3], 60);
    noise(0.8, 0.2, 700); beep(200, 0.5, 'square', 0.05, 0.3);
    A.shake(4);
  }
  function impact(e) {
    e.dead = true; release(e);
    blast(e.x, e.ty, 9, 'ground');
    if (!live) return;                                  // the title's demo never loses a tower
    cities.forEach(function (c) { if (c.alive && Math.abs(c.x - e.x) <= 12) destroyCity(c); });
    bats.forEach(function (b) { if (b.alive && Math.abs(b.x - e.x) <= 14) destroyBat(b); });
  }

  function launch(b, tx, ty) {
    ty = Math.min(ty, GY - 24);
    var sx = b.x, sy = GY - 19, dx = tx - sx, dy = ty - sy, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    abms.push({ sx: sx, sy: sy, x: sx, y: sy, tx: tx, ty: ty, vx: dx / d * b.v, vy: dy / d * b.v, v: b.v, left: d });
    b.ammo--;

      if (Math.floor(t * 4) % 2) cities.forEach(function (c) { if (c.alive) sprite(g, ARROW, c.x - 2, GY - c.d.top - 7, { a: P.yel }); });
    }
    if (phase === 'bonus' && bonus) {
      var y0 = 62;
      g.fillStyle = 'rgba(4,2,10,0.78)'; g.fillRect(0, y0, W, 78);
      g.fillStyle = P.pink; g.fillRect(0, y0, W, 1); g.fillRect(0, y0 + 77, W, 1);
      api.text(g, 'WAVE ' + wave + ' CLEARED', cx + 1, y0 + 9, P.mag, 2, 'center');
      api.text(g, 'WAVE ' + wave + ' CLEARED', cx, y0 + 8, P.cyan2, 2, 'center');
      api.text(g, 'BONUS POINTS', cx, y0 + 29, P.yel, 1, 'center');
      for (i = 0; i < bonus.ammo; i++) {
        var px = 96 + (i % 30) * 3, py = y0 + 43 + Math.floor(i / 30) * 4;
        g.fillStyle = P.white; g.fillRect(px, py, 1, 1);
        g.fillStyle = P.cyan2; g.fillRect(px, py + 1, 1, 2);
      }
      api.text(g, String(bonus.ammo * 5), 232, y0 + 42, P.white, 1, 'right');
      for (i = 0; i < bonus.cities; i++) sprite(g, MINI, 96 + i * 9, y0 + 56, MINI_COLS);
      api.text(g, String(bonus.cities * 100), 232, y0 + 56, P.white, 1, 'right');
    }
    pops.forEach(function (p) {
      if (p.life < 0.3 && Math.floor(t * 10) % 2) return;
      api.text(g, p.s, Math.round(p.x) + 1, Math.round(p.y) + 1, P.bg, 1, 'center');
      api.text(g, p.s, Math.round(p.x), Math.round(p.y), p.col, 1, 'center');
    });
    // the sight
    if (mode === 'play' && phase !== 'end' && phase !== 'bonus') {
      sprite(g, RETICLE, Math.round(cross.x) - 4, Math.round(cross.y) - 4, { c: P.cyan2, k: P.white, w: Math.floor(t * 4) % 2 ? P.pink : P.white });
    }
  }

  var game = {
    id: 'missile-command', title: 'MISSILE COMMAND', w: W, h: H, pal: 'void',
    help: ['HOLD THE BRINK - SAVE THE CRYSTAL SPIRES', 'CLICK OR TAP THE SKY TO FIRE', 'ARROWS AIM - SPACE FIRES THE NEAREST', '1 2 3 OR A S D FIRE LEFT MIDDLE RIGHT'],
    coins: { per: 150, best: 20 },                     // a decent run (wave 9, ~11k) pays ~70 here plus ~50 in wave coins

    start: function (api) {
      A = api; live = true; demo = null;
      api.pointer.pressed = false;                      // the tap that started the run isn't a shot
      resetWorld();
      wave = 0; spare = 0; nextCity = 10000; endT = 0; bonus = null;
      hi = ((BridgeArcade.scores() || {})['missile-command'] || {}).best || 0;
      cross.x = W / 2; cross.y = 120; lastPx = api.pointer.x; lastPy = api.pointer.y;
      nextWave(api);
    },

    attract: function (api, dt) {                       // the title's demo: the silos defend on their own
      A = api; live = false;
      if (!demo) { resetWorld(); wave = 1; phase = 'fight'; demo = { spawn: 0.3, fire: 1.2 }; }
      demo.spawn -= dt;
      if (demo.spawn <= 0) {
        if (foes.length < 6) launchFoe(rnd(10, W - 10), -2, { mirv: Math.random() < 0.25 });
        demo.spawn = rnd(0.6, 1.6);
      }
      demo.fire -= dt;
      if (demo.fire <= 0) {
        demo.fire = rnd(0.35, 0.8);
        var e = null;
        foes.forEach(function (f) { if (!f.aimed && f.y > 25 && (!e || f.y > e.y)) e = f; });
        if (e) {
          var b = bats[0];
          bats.forEach(function (bb) { if (Math.abs(bb.x - e.x) < Math.abs(b.x - e.x)) b = bb; });
          var tx = e.x, ty = e.y;
          for (var k = 0; k < 3; k++) { var tt = Math.hypot(tx - b.x, ty - (GY - 19)) / b.v; tx = e.x + e.vx * tt; ty = e.y + e.vy * tt; }
          if (ty < GY - 30) { launch(b, tx, ty); b.ammo = 10; }
          e.aimed = true;
        }
      }
      stepWorld(dt);
    },

    update: function (api, dt) {
      A = api; live = true;
      aim(api, dt);
      if (phase === 'intro') {
        phaseT -= dt;
        if (phaseT <= 0) { phase = 'fight'; salvoT = 0.2; tune([660, 880, 660, 880], 0.13, 'square', 0.035); }
      } else if (phase === 'fight') {
        fight(api, dt);
      } else if (phase === 'bonus') {
        stepBonus(api, dt);
      } else if (phase === 'end') {
        endT += dt;
        if (endT >= 2.8) { api.over(); return; }
      }
      stepWorld(dt);
      if (phase === 'fight') {
        if (!cities.some(function (c) { return c.alive; }) && !spare) startEnd();
        else if (waveClear()) startBonus(api);
      }
    },

    draw: function (g, api, mode) {
      A = api;
      if (!bg) makeScenery(api);
      if (!cities) resetWorld();
      var cur = mode === 'play' ? 'none' : 'default';
      if (g.canvas.style.cursor !== cur) g.canvas.style.cursor = cur;
      var t = api.t;
      g.drawImage(bg, 0, 0);
      drawSky(g, t);
      cities.forEach(function (c) { drawCity(g, c, t); });
      bats.forEach(function (b) { drawBattery(g, b, t); });
      stubs.forEach(function (s) { api.line(g, s.sx, s.sy, s.x, s.y, P.mag); });
      foes.forEach(function (e) { drawTrail(g, e); });
      abms.forEach(function (a) { api.line(g, a.sx, a.sy, a.x, a.y, P.cyan); });
      fliers.forEach(function (f) { drawFlier(g, f, t); });
      blasts.forEach(function (b) { drawBlast(g, b, t); });
      bits.forEach(function (b) {
        var big = b.smoke && b.life > 1.2;
        g.fillStyle = b.smoke ? (b.life > 1.5 ? P.grey : b.life > 0.7 ? P.hi : P.mid) : b.col;
        g.fillRect(Math.round(b.x), Math.round(b.y), big ? 2 : 1, big ? 2 : 1);
      });
      foes.forEach(function (e) { drawHead(g, e, t); });
      abms.forEach(function (a) { drawAbm(g, a, t); });
      if (mode !== 'title') overlays(g, api, mode);
    }
  };

  BridgeArcade.run(game);
})();
</script>
</body>
</html>
