<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout — Becknology</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/bridge/js/shared/progression.js"></script>
<script src="/bridge/js/shared/arcade-kit.js"></script>
</head>
<body>
<script>
/**
 * Breakout — a cabinet in the Arcade, Arcadia (BridgeArcade kit,
 * apps/bridge/js/shared/arcade-kit.js). 240×300 native, portrait, neon over
 * the District's skyline: eight designed walls (the city's name, an invader,
 * a heart, a pyramid, a checkerboard, a diamond, the skyline, NULL's mark)
 * that loop round tougher and faster; bricks crack before they go, steel never
 * does; capsules to catch (Wide, Multi, Slow, Life, Zapper); a combo
 * multiplier for bricks broken between touches of the paddle. Coins for every
 * wall cleared and for the score at the end.
 */
(function () {
  var W = 240, H = 300, P = BridgeArcade.PAL.arcadia;
  var FX0 = 4, FX1 = W - 4, FY0 = 17;                 // inside the walls (the HUD sits above the top one)
  var BW = 13, BH = 7, CW = 14, CH = 8, COLS = 16;    // a brick, and its cell with 1px of mortar
  var GX = 8, GY = 33;                                // top-left of the brick grid
  var PY = 282, PH = 6, R = 2;                        // paddle top and height; half the 4×4 ball
  var INK = '#0e0a1e';                                // outlines
  var TOUCH = 'ontouchstart' in window || !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  // brick colours from the Arcadia neons: highlight, body, shadow, outline
  var RAMP = {
    p: ['#f8b8d0', P.pink, '#b04878', '#3a1028'],
    k: ['#f8b0e0', P.pink2, '#a84088', '#30102a'],
    m: [P.pink2, P.mag, '#682890', '#24103a'],
    c: ['#b8f4f8', P.cyan, '#2c8090', '#0c2838'],
    u: ['#b0bcf8', P.purp, '#4450a8', '#161848'],
    y: ['#f8e8a0', P.yel, '#a88020', '#382408'],
    g: ['#a8f8c8', P.green, '#20985a', '#0a2c1c'],
    r: ['#f8a0a0', P.red, '#a02838', '#380a14'],
    w: ['#ffffff', '#d8d4ec', P.grey, P.mid],
    '*': ['#ffffff', '#b8b4d0', '#6a6488', P.dark],   // chrome: three hits
    '#': ['#6a6a88', P.hi, P.mid, INK]                // steel: never breaks
  };

  // the walls. Lowercase is one hit, uppercase two, * chrome three, # steel; rows centre themselves
  var LEVELS = [
    { name: 'ARCADIA', rows: [
      'ppp.pp..ppp.ppp',
      'p.p.p.p.p...p.p',
      'kkk.kk..k...kkk',
      'm.m.m.m.m...m.m',
      'm.m.m.m.mmm.m.m',
      '',
      'cc..ccc.ccc',
      'c.c..c..c.c',
      'c.c..c..ccc',
      'u.u..u..u.u',
      'uu..uuu.u.u',
      '',
      'yyyyyyyyyyyyyyy'] },
    { name: 'INVADER', rows: [                       // two rows of bricks to a sprite pixel, so it keeps its shape
      '..g.....g..', '..g.....g..',
      '...g...g...', '...g...g...',
      '..GGGGGGG..', '..GGGGGGG..',
      '.GGRGGGRGG.', '.GGRGGGRGG.',
      'ggggggggggg', 'ggggggggggg',
      'g.ggggggg.g', 'g.ggggggg.g',
      'g.g.....g.g', 'g.g.....g.g',
      '...gg.gg...', '...gg.gg...'] },
    { name: 'HEART', rows: [                         // odd and even rows sit half a brick apart: smoother curves
      'ppp..ppp',
      'pwwp.pppp',
      'pwRRppRRpp',
      'ppRRRRRRpp',
      'ppRRRRRpp',
      'ppRRRRpp',
      'ppRRRpp',
      'ppRRpp',
      'ppRpp',
      'pppp',
      'ppp',
      'pp',
      'p'] },
    { name: 'PYRAMID', rows: [
      '**',
      'yyy',
      'YyyY',
      'ppppp',
      'PppppP',
      'pppcppp',
      'KkkkkkkK',
      'kkkkkkkkk',
      'KkkkkkkkkK',
      'mmmmmmmmmmm',
      'Mmmmm..mmmmM',
      'mmmmm...mmmmm'] },
    { name: 'CHECKER', rows: [
      'cucucucucucucucu',
      'UcUcUcUcUcUcUcUc',
      'cUcUcUcUcUcUcUcU',
      '',
      'y.y.y.y.y.y.y.y.',
      '.y.y.y.y.y.y.y.y',
      'k.k.k.k.k.k.k.k.',
      '.k.k.k.k.k.k.k.k',
      'w.w.w.w.w.w.w.w.'] },
    { name: 'DIAMOND', rows: function () {
      var rows = [], N = 6, ring = ['*', 'Y', 'K', 'k', 'm', 'u', 'c'];
      for (var r = 0; r <= 2 * N; r++) {
        var dy = Math.abs(r - N), w = 2 * (N - dy) + 1, s = '';
        for (var i = 0; i < w; i++) {
          var dx = Math.abs(i - (w - 1) / 2), d = dx + dy;
          s += d === N && (dx === 0 || dy === 0) ? '#' : ring[d];   // steel on the four tips
        }
        rows.push(s);
      }
      return rows;
    } },
    { name: 'SKYLINE', rows: [
      '........r.......',
      '.r......u.......',
      '.u.....UUU......',
      'MMM....UyU....r.',
      'MyM....UUU...CCC',
      'MMM....UyU.kkCyC',
      'MyM.gg.UUU.ykCCC',
      'MMM.gy.UyU.kkCyC',
      'MyM.gg.UUU.kyCCC',
      'MMM.yg.UyU.kkCyC',
      '###.##.###.#####'] },
    { name: 'NULL', rows: [                          // their mark, sprayed on everything
      '..k.......#.....',
      '......MMMMR...u.',
      '.u..MMM..RMM....',
      '....MM...RMM..k.',
      '.k..M...R..M....',
      '....M...*..M....',
      '....M..*...M.k..',
      '..u.M..R...M....',
      '....MMR...MM..u.',
      '.k..MMR..MMM....',
      '.....RMMMM....k.',
      '.....#.m.m......',
      '.......m.m......',
      '.........m......'] }
  ];

  // capsules: letter, colour, what the popup says
  var POW = { W: { col: 'c', name: 'WIDE' }, M: { col: 'm', name: 'MULTI' }, S: { col: 'u', name: 'SLOW' },
              L: { col: 'r', name: '+1 LIFE' }, Z: { col: 'y', name: 'ZAPPER' } };

  var bricks, balls, caps, bolts, bits, pops, sparks, pad, level, left, total, combo, levelName,
      playT, idleT, wideT, slowT, laserT, laserCool, introT, clearT, deadT, launchLock, aim = 0, demoT = 0,
      lastMode, steer = 'ptr', lastPX = null, lastPY = null, wasDown = false, pressOk = false, backdrop = null, lights = [];

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function baseW() { return Math.max(26, 38 - 2 * (level - 1)); }     // the paddle narrows a little each wall, never below 26
  function mult() { return Math.min(5, 1 + Math.floor(combo / 5)); }

  // ---- the wall -----------------------------------------------------------------------------------
  function crack(down) {                             // a crack's pixels inside a brick: one runs down, one across
    var a = [], i, x, y;
    if (down) {
      x = 3 + Math.floor(Math.random() * 7);
      for (i = 1; i <= 5; i++) { a.push([x, i]); x = clamp(x + Math.floor(Math.random() * 3) - 1, 2, 10); }
    } else {
      y = 2 + Math.floor(Math.random() * 3); x = Math.random() < 0.5 ? 1 : 7;
      for (i = 0; i < 5; i++) { a.push([x + i, y]); if (Math.random() < 0.4) y = clamp(y + (Math.random() < 0.5 ? -1 : 1), 1, 5); }
    }
    return a;
  }

  function build(lv, now) {
    var L = LEVELS[(lv - 1) % LEVELS.length], loop = Math.floor((lv - 1) / LEVELS.length);
    var rows = typeof L.rows === 'function' ? L.rows() : L.rows, n = 0;
    bricks = []; total = 0;
    rows.forEach(function (row, r) {
      var x0 = GX + (COLS - row.length) * CW / 2;
      for (var i = 0; i < row.length; i++) {
        var ch = row[i];
        if (ch === '.') continue;
        var key = ch.toLowerCase(), steel = ch === '#';
        var hp = steel ? 1 : ch === '*' ? 3 : ch !== key ? 2 : 1;
        if (!steel) { hp = Math.min(3, hp + loop); total++; }      // second time round, everything takes a hit more
        bricks.push({ x: x0 + i * CW, y: GY + r * CH, key: key, hp: hp, max: hp, steel: steel, flash: 0,
                      born: now + n * 0.008, cracks: [crack(true), crack(false)] });
        n++;
      }
    });
    left = total;
    levelName = L.name;
  }

  function serve() {
    balls = [{ x: pad.x, y: PY - R, vx: 0, vy: -1, stuck: true, dx: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.floor(Math.random() * 4)), trail: [] }];
    launchLock = 0.25;
  }

  function beginLevel(api) {
    api.level = level;
    build(level, api.t);
    caps = []; bolts = [];
    combo = 0; playT = 0; idleT = 0; wideT = 0; slowT = 0; laserT = 0; laserCool = 0;
    introT = 2.4; clearT = 0; deadT = 0;
    serve();
  }

  function speedNow() {                              // px/s: faster each wall, faster as the wall thins, slower under SLOW
    var base = Math.min(190, 110 + (level - 1) * 8);
    var ramp = 1 + 0.3 * (total ? 1 - left / total : 0) + Math.min(0.15, playT / 200);
    var slow = slowT > 0 ? (slowT > 2 ? 0.62 : 0.62 + 0.38 * (1 - slowT / 2)) : 1;
    return Math.min(250, base * ramp) * slow;
  }

  // ---- effects ------------------------------------------------------------------------------------
  function shatter(br) {
    var c = RAMP[br.key];
    for (var i = 0; i < 12; i++) {
      var a = Math.random() * Math.PI * 2, v = 25 + Math.random() * 65;
      bits.push({ x: br.x + 1 + Math.random() * 11, y: br.y + 1 + Math.random() * 5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 35,
                  life: 0.35 + Math.random() * 0.5, col: c[i % 3], s: i < 4 ? 2 : 1 });
    }
  }
  function chips(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 40;
      bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: 0.2 + Math.random() * 0.3, col: col, s: 1 });
    }
  }
  function wallHit(api, side, at, demo) {
    sparks.push({ side: side, at: Math.round(at), t: 0.15 });
    if (!demo) api.beep(190, 0.04, 'square', 0.025);
  }
  function pop(s, x, y, col, t) { pops.push({ s: s, x: Math.round(clamp(x, 30, W - 30)), y: y, col: col, t: t || 0.9 }); }
  function notes(api, list, step, type) {
    list.forEach(function (f, i) { setTimeout(function () { api.beep(f, 0.12, type || 'square', 0.045); }, i * step); });
  }

  // ---- the ball -----------------------------------------------------------------------------------
  function brickAt(x, y, w, h) {                    // the brick a box overlaps, nearest its centre
    var best = null, bd = 1e9, cx = x + w / 2, cy = y + h / 2;
    for (var i = 0; i < bricks.length; i++) {
      var br = bricks[i];
      if (x < br.x + BW && x + w > br.x && y < br.y + BH && y + h > br.y) {
        var d = Math.abs(br.x + BW / 2 - cx) + Math.abs(br.y + BH / 2 - cy);
        if (d < bd) { bd = d; best = br; }
      }
    }
    return best;
  }

  function strike(api, br, demo, byBall) {
    br.flash = 0.07;
    if (br.steel) {
      chips(br.x + 6, br.y + 3, P.grey, 2);
      if (!demo) api.beep(1250 + Math.random() * 250, 0.05, 'square', 0.025, 0.8);
      return;
    }
    if (byBall) idleT = 0;
    br.hp--;
    if (br.hp > 0) {                                   // it holds, and cracks
      chips(br.x + 6, br.y + 3, RAMP[br.key][2], 3);
      if (!demo) { api.score += 2; api.beep(200 + br.hp * 70, 0.07, 'square', 0.04, 0.6); api.noise(0.05, 0.05, 2600); }
      return;
    }
    bricks.splice(bricks.indexOf(br), 1);
    left--;
    shatter(br);
    if (demo) return;
    if (byBall) combo++;
    var m = mult();
    api.score += 10 * br.max * m;
    api.beep(330 * Math.pow(1.06, Math.min(combo, 18)), 0.07, 'square', 0.045, 1.25);
    if (byBall && combo % 5 === 0 && combo <= 20) { pop('COMBO X' + m, br.x + 6, br.y - 4, P.yel); api.beep(1046, 0.12, 'triangle', 0.04, 1.5); }
    if (br.max > 1) api.shake(2);
    if (caps.length < 3 && Math.random() < 0.12) {     // a capsule falls out
      var pool = 'WWWWMMMSSSL' + (level >= 2 ? 'ZZZ' : '');
      caps.push({ x: br.x + 6, y: br.y + 3, type: pool[Math.floor(Math.random() * pool.length)] });
    }
  }

  function bounce(api, b, sp, demo) {                // the angle comes from where it meets the paddle
    var off = clamp((b.x - pad.x) / (pad.w / 2 + R), -1, 1), a = off * 1.05;   // up to 60° off vertical
    if (Math.abs(a) < 0.14) a = (a < 0 || (a === 0 && Math.random() < 0.5) ? -1 : 1) * 0.14;
    b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp;
    if (demo) { aim = (Math.random() - 0.5) * pad.w * 0.8; return; }
    combo = 0; idleT = 0;
    api.beep(262, 0.06, 'triangle', 0.06, 1.3);
  }

  function stepBall(api, b, sp, dt, demo) {
    var len = Math.hypot(b.vx, b.vy) || 1;
    b.vx /= len; b.vy /= len;
    if (Math.abs(b.vy) < 0.3) { b.vy = b.vy < 0 ? -0.3 : 0.3; b.vx = (b.vx < 0 ? -1 : 1) * 0.954; }   // never a flat skim
    b.vx *= sp; b.vy *= sp;
    var n = Math.max(1, Math.ceil(sp * dt)), h = dt / n, hit;   // under a pixel a step: nothing tunnels
    for (var k = 0; k < n && !b.dead; k++) {
      b.x += b.vx * h;
      if (b.x - R < FX0) { b.x = FX0 + R; b.vx = Math.abs(b.vx); wallHit(api, 'l', b.y, demo); }
      else if (b.x + R > FX1) { b.x = FX1 - R; b.vx = -Math.abs(b.vx); wallHit(api, 'r', b.y, demo); }
      else if ((hit = brickAt(b.x - R, b.y - R, 2 * R, 2 * R))) { b.x -= b.vx * h; b.vx = -b.vx; strike(api, hit, demo, true); }
      var bottom = b.y + R;
      b.y += b.vy * h;
      if (b.y - R < FY0) { b.y = FY0 + R; b.vy = Math.abs(b.vy); wallHit(api, 't', b.x, demo); }
      else if ((hit = brickAt(b.x - R, b.y - R, 2 * R, 2 * R))) { b.y -= b.vy * h; b.vy = -b.vy; strike(api, hit, demo, true); }
      else if (b.vy > 0 && bottom <= PY + 1 && b.y + R >= PY && b.x + R > pad.x - pad.w / 2 && b.x - R < pad.x + pad.w / 2) {
        b.y = PY - R; bounce(api, b, sp, demo);
      }
      if (b.y - R > H) b.dead = true;
    }
    b.trail.unshift([Math.round(b.x), Math.round(b.y)]);
    if (b.trail.length > 7) b.trail.pop();
  }

  function launch(api) {
    balls.forEach(function (b) {
      if (!b.stuck) return;
      var a = clamp(b.dx / (pad.w / 2) * 1.05, -1.05, 1.05);
      if (Math.abs(a) < 0.3) a = (b.dx < 0 ? -1 : 1) * 0.3;
      b.stuck = false; b.vx = Math.sin(a); b.vy = -Math.cos(a);
    });
    introT = 0;
    api.beep(440, 0.08, 'square', 0.04, 1.6);
  }

  function zap(api) {
    var x0 = Math.round(pad.x - pad.w / 2), w = Math.round(pad.w);
    bolts.push({ x: x0 + 2, y: PY - 7 }, { x: x0 + w - 4, y: PY - 7 });
    laserCool = 0.3;
    api.beep(1500, 0.06, 'square', 0.025, 0.35);
  }

  function power(api, t) {
    api.score += 25;
    if (t === 'W') wideT = 15;
    else if (t === 'S') slowT = 10;
    else if (t === 'Z') laserT = 10;
    else if (t === 'L') api.lives = Math.min(6, api.lives + 1);
    else if (t === 'M') {
      var add = [];
      balls.forEach(function (b) {
        if (b.stuck) return;
        [-0.45, 0.45].forEach(function (da) {
          if (balls.length + add.length >= 9) return;
          var a = Math.atan2(b.vy, b.vx) + da;
          add.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), stuck: false, dx: 0, trail: [] });
        });
      });
      balls = balls.concat(add);
    }
    pop(POW[t].name, pad.x, PY - 14, RAMP[POW[t].col][0]);
    notes(api, t === 'L' ? [523, 659, 784, 1046] : [660, 990, 1320], 60);
  }

  function loseLife(api) {
    api.lives--;
    api.shake(4); api.flash(P.red);
    api.noise(0.5, 0.18, 700); api.beep(330, 0.6, 'sawtooth', 0.05, 0.3);
    chips(pad.x, PY + 2, P.pink, 10); chips(pad.x, PY + 2, P.cyan, 8);
    caps = []; bolts = []; wideT = 0; slowT = 0; laserT = 0; combo = 0; playT = 0; idleT = 0;
    // the paddle goes back to this wall's width (not the first wall's): the target in update() is baseW()
    if (api.lives <= 0) { deadT = 1.4; balls = []; return; }
    serve();
  }

  function cleared(api) {
    var bonus = 100 * level;
    api.score += bonus;
    api.award(3 + level, 'level');
    clearT = 2.4; balls = []; caps = []; bolts = [];
    pop('+' + bonus + ' BONUS', W / 2, 214, P.yel, 2.2);
    api.flash(P.cyan2); api.shake(3);
    notes(api, [523, 659, 784, 1046, 1318], 90, 'triangle');
  }

  function trophy() {                                // all five classics played: Cabinet Crusher
    try { if (window.BridgeProgression && BridgeProgression.maybeAwardCabinetCrusher) BridgeProgression.maybeAwardCabinetCrusher().catch(function () {}); } catch (e) { /* offline */ }
  }

  // ---- input --------------------------------------------------------------------------------------
  function controls(api, dt, fresh) {                // steer the paddle; true when the player asks to launch / fire
    var p = api.pointer;
    if (p.x !== lastPX || p.y !== lastPY) { if (lastPX !== null) steer = 'ptr'; lastPX = p.x; lastPY = p.y; }
    var dir = (api.down('ArrowLeft') || api.down('a') || api.down('A') ? -1 : 0) + (api.down('ArrowRight') || api.down('d') || api.down('D') ? 1 : 0);
    if (dir) steer = 'key';
    if (steer === 'key') pad.x += dir * 230 * dt; else pad.x = p.x;
    pad.x = clamp(pad.x, FX0 + pad.w / 2, FX1 - pad.w / 2);
    var tap = false, began = p.pressed || (p.down && !wasDown);   // a tap launches on release, so a finger can drag first
    if (began) pressOk = !fresh;
    if (!p.down && (wasDown || began) && pressOk) { tap = true; pressOk = false; }   // even a press and release inside one frame
    wasDown = p.down;
    return !fresh && (api.fire() || api.pressed('ArrowUp') || api.pressed('w') || api.pressed('W') || tap);
  }

  // ---- the attract demo (title screen) ------------------------------------------------------------
  function demoSetup(now) {
    level = 1; build(1, now - 10);
    pad = { x: W / 2, w: baseW() };
    caps = []; bolts = []; pops = []; sparks = []; bits = bits || [];
    combo = 0; playT = 0; idleT = 0; wideT = 0; slowT = 0; laserT = 0; introT = 0; clearT = 0; deadT = 0;
    balls = [{ x: W / 2, y: PY - R, vx: 0, vy: -1, stuck: true, dx: 5, trail: [] }];
    demoT = 0.8;
  }

  // ---- the backdrop: night over the District, painted once ------------------------------------------
  function rng(seed) { return function () { seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; }; }
  function paintBackdrop() {
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'), r = rng(11), x, y, i;
    function dither(y0, h, a, b) { for (y = y0; y < y0 + h; y++) for (x = 0; x < W; x++) { g.fillStyle = (x + y) % 2 ? b : a; g.fillRect(x, y, 1, 1); } }
    g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
    dither(196, 6, P.bg, P.bg2);
    g.fillStyle = P.bg2; g.fillRect(0, 202, W, 40);
    dither(242, 6, P.bg2, P.purp2);
    g.fillStyle = P.purp2; g.fillRect(0, 248, W, H - 248);
    for (i = 0; i < 46; i++) {                          // stars
      var sy = 20 + Math.floor(r() * 176);
      g.fillStyle = r() < 0.15 ? P.grey : r() < 0.5 ? P.hi : P.mid;
      g.fillRect(4 + Math.floor(r() * (W - 8)), sy, 1, 1);
    }
    // far towers against the glow, their windows in a dim grid
    x = 0;
    while (x < W) {
      var w = 10 + Math.floor(r() * 14), top = 214 + Math.floor(r() * 40);
      g.fillStyle = P.dark; g.fillRect(x, top, w, H - top);
      g.fillStyle = P.mid; g.fillRect(x, top, w, 1);
      if (r() < 0.35) { var ax = x + Math.floor(w / 2); g.fillStyle = P.mid; g.fillRect(ax, top - 6, 1, 6); lights.push([ax, top - 7, P.red, r() * 6]); }
      for (y = top + 3; y < H - 2; y += 3) for (i = x + 2; i < x + w - 2; i += 3) if (r() < 0.22) { g.fillStyle = r() < 0.75 ? P.purp2 : P.mag; g.fillRect(i, y, 1, 1); }
      x += w + 1 + Math.floor(r() * 3);
    }
    // near rooftops under the paddle, a few windows still lit
    x = -4;
    while (x < W) {
      var nw = 16 + Math.floor(r() * 18), nt = 262 + Math.floor(r() * 22);
      g.fillStyle = P.bg; g.fillRect(x, nt, nw, H - nt);
      g.fillStyle = P.dark; g.fillRect(x, nt, nw, 1);
      for (y = nt + 4; y < H - 2; y += 4) for (i = x + 3; i < x + nw - 3; i += 4) if (r() < 0.16) lights.push([i, y, r() < 0.7 ? P.yel : P.pink, r() * 6]);
      x += nw + Math.floor(r() * 4);
    }
    // the HUD strip
    g.fillStyle = P.bg2; g.fillRect(0, 0, W, 13);
    // the walls: metal pipes with a neon tube down each, bracketed every 24px
    g.fillStyle = INK; g.fillRect(0, 13, W, 4); g.fillRect(0, 13, 4, H); g.fillRect(W - 4, 13, 4, H);
    g.fillStyle = P.hi; g.fillRect(1, 14, W - 2, 1); g.fillRect(1, 14, 1, H); g.fillRect(W - 2, 14, 1, H);
    g.fillStyle = P.pink; g.fillRect(2, 15, W - 4, 1);
    g.fillStyle = P.cyan; g.fillRect(2, 16, 1, H); g.fillRect(W - 3, 16, 1, H);
    g.fillStyle = P.mid; g.fillRect(4, 16, W - 8, 1); g.fillRect(3, 16, 1, H); g.fillRect(W - 4, 16, 1, H);
    for (i = 28; i < W - 8; i += 24) { g.fillStyle = P.grey; g.fillRect(i, 13, 2, 4); g.fillStyle = INK; g.fillRect(i + 2, 13, 1, 4); }
    for (y = 40; y < H; y += 24) { g.fillStyle = P.grey; g.fillRect(0, y, 4, 2); g.fillRect(W - 4, y, 4, 2); g.fillStyle = INK; g.fillRect(0, y + 2, 4, 1); g.fillRect(W - 4, y + 2, 4, 1); }
    g.fillStyle = P.hi; g.fillRect(0, 13, 4, 4); g.fillRect(W - 4, 13, 4, 4);   // corner blocks
    g.fillStyle = P.grey; g.fillRect(1, 14, 1, 1); g.fillRect(W - 2, 14, 1, 1);
    return c;
  }

  // ---- drawing ------------------------------------------------------------------------------------
  function drawBrick(g, br, t) {
    if (t < br.born) return;
    var x = br.x, y = br.y - Math.round(8 * Math.max(0, 1 - (t - br.born) / 0.15)), c = RAMP[br.key];
    g.fillStyle = c[3];                                 // outline, corners cut
    g.fillRect(x + 1, y, BW - 2, 1); g.fillRect(x + 1, y + BH - 1, BW - 2, 1);
    g.fillRect(x, y + 1, 1, BH - 2); g.fillRect(x + BW - 1, y + 1, 1, BH - 2);
    if (br.flash > 0) { g.fillStyle = P.white; g.fillRect(x + 1, y + 1, BW - 2, BH - 2); return; }
    g.fillStyle = c[1]; g.fillRect(x + 1, y + 1, BW - 2, BH - 2);
    g.fillStyle = c[0]; g.fillRect(x + 1, y + 1, BW - 3, 1); g.fillRect(x + 1, y + 2, 1, BH - 4);
    g.fillStyle = c[2]; g.fillRect(x + 2, y + BH - 2, BW - 3, 1); g.fillRect(x + BW - 2, y + 1, 1, BH - 3);
    if (br.steel) {                                      // rivets
      g.fillStyle = P.grey; g.fillRect(x + 2, y + 2, 1, 1); g.fillRect(x + 10, y + 2, 1, 1); g.fillRect(x + 2, y + 4, 1, 1); g.fillRect(x + 10, y + 4, 1, 1);
      g.fillStyle = c[2]; g.fillRect(x + 4, y + 3, 5, 1);
      return;
    }
    if (br.key === '*') {                                // chrome: a glint across it
      g.fillStyle = '#ffffff'; g.fillRect(x + 7, y + 2, 1, 1); g.fillRect(x + 6, y + 3, 1, 1); g.fillRect(x + 5, y + 4, 1, 1); g.fillRect(x + 9, y + 2, 1, 1); g.fillRect(x + 8, y + 3, 1, 1);
    } else if (br.max > 1) {                             // tough bricks are bolted
      g.fillStyle = c[2]; g.fillRect(x + 3, y + 3, 1, 1); g.fillRect(x + 9, y + 3, 1, 1);
      g.fillStyle = c[0]; g.fillRect(x + 3, y + 2, 1, 1); g.fillRect(x + 9, y + 2, 1, 1);
    }
    var stage = br.hp === br.max ? 0 : br.hp === 1 ? 2 : 1;
    if (stage) {
      g.fillStyle = c[3];
      br.cracks[0].forEach(function (p) { g.fillRect(x + p[0], y + p[1], 1, 1); });
      if (stage > 1) {
        br.cracks[1].forEach(function (p) { g.fillRect(x + p[0], y + p[1], 1, 1); });
        g.fillStyle = P.bg; g.fillRect(x + BW - 2, y, 2, 1); g.fillRect(x + BW - 1, y + 1, 1, 1);   // a chipped corner
      }
    }
  }

  function drawCap(g, cp, t) {                       // a 17×9 pill: ends that roll as it falls, a label with the kit's letter
    var x = Math.round(cp.x) - 8, y = Math.round(cp.y) - 4, c = RAMP[POW[cp.type].col], roll = Math.floor(t * 10 + cp.x) % 2;
    g.fillStyle = c[3];
    g.fillRect(x + 2, y, 13, 1); g.fillRect(x + 2, y + 8, 13, 1);
    g.fillRect(x + 1, y + 1, 1, 1); g.fillRect(x + 15, y + 1, 1, 1); g.fillRect(x + 1, y + 7, 1, 1); g.fillRect(x + 15, y + 7, 1, 1);
    g.fillRect(x, y + 2, 1, 5); g.fillRect(x + 16, y + 2, 1, 5);
    g.fillRect(x + 3, y + 1, 1, 7); g.fillRect(x + 13, y + 1, 1, 7);            // seams between the ends and the label
    g.fillStyle = c[2]; g.fillRect(x + 1, y + 2, 1, 5); g.fillRect(x + 15, y + 2, 1, 5); g.fillRect(x + 2, y + 1, 1, 7); g.fillRect(x + 14, y + 1, 1, 7);
    g.fillStyle = roll ? c[0] : c[1]; g.fillRect(x + 2, y + (roll ? 2 : 4), 1, 2); g.fillRect(x + 14, y + (roll ? 2 : 4), 1, 2);
    g.fillStyle = c[1]; g.fillRect(x + 4, y + 1, 9, 7);
    g.fillStyle = c[0]; g.fillRect(x + 4, y + 1, 9, 1);
    g.fillStyle = INK;
    var rows = BridgeArcade.font[cp.type];
    for (var ry = 0; ry < 7; ry++) for (var rx = 0; rx < 5; rx++) if (rows[ry] & (16 >> rx)) g.fillRect(x + 6 + rx, y + 1 + ry, 1, 1);
  }

  function drawPaddle(g, t) {
    var w = Math.round(pad.w), x = Math.round(pad.x - pad.w / 2), y = PY;
    var capCol = wideT > 0 && wideT < 2 && Math.floor(t * 8) % 2 ? P.white : P.cyan;
    if (laserT > 0) {                                    // the Zapper's two barrels
      var blink = laserT < 2 && Math.floor(t * 8) % 2;
      [x + 1, x + w - 5].forEach(function (bx) {
        g.fillStyle = INK; g.fillRect(bx, y - 4, 4, 4);
        g.fillStyle = blink ? P.white : P.yel; g.fillRect(bx + 1, y - 4, 2, 4);
        g.fillStyle = '#a88020'; g.fillRect(bx + 2, y - 3, 1, 3);
      });
    }
    g.fillStyle = INK;
    g.fillRect(x + 1, y, w - 2, 1); g.fillRect(x + 1, y + PH - 1, w - 2, 1);
    g.fillRect(x, y + 1, 1, PH - 2); g.fillRect(x + w - 1, y + 1, 1, PH - 2);
    g.fillStyle = P.pink; g.fillRect(x + 1, y + 1, w - 2, PH - 2);
    g.fillStyle = '#f8b8d0'; g.fillRect(x + 1, y + 1, w - 2, 1);
    g.fillStyle = '#b04878'; g.fillRect(x + 1, y + PH - 2, w - 2, 1);
    [x + 1, x + w - 5].forEach(function (cx) {          // cyan end caps
      g.fillStyle = capCol; g.fillRect(cx, y + 1, 4, PH - 2);
      g.fillStyle = capCol === P.white ? P.white : P.cyan2; g.fillRect(cx, y + 1, 4, 1);
      g.fillStyle = '#2c8090'; g.fillRect(cx, y + PH - 2, 4, 1);
    });
    g.fillStyle = INK; g.fillRect(x + 5, y + 1, 1, PH - 2); g.fillRect(x + w - 6, y + 1, 1, PH - 2);
    g.fillStyle = Math.floor(t * 2) % 2 ? P.yel : '#a88020';
    g.fillRect(x + Math.floor(w / 2) - 1, y + 2, 2, 2);  // the running light
  }

  function drawBall(g, b) {
    var cols = [P.cyan, P.cyan, P.purp, P.purp, P.mid, P.mid];
    for (var i = b.trail.length - 1; i >= 1; i--) {
      if (i % 2) continue;
      var p = b.trail[i], s = i < 4 ? 2 : 1;
      g.fillStyle = cols[i - 1]; g.fillRect(p[0] - 1, p[1] - 1, s, s);
    }
    var x = Math.round(b.x) - 2, y = Math.round(b.y) - 2;
    g.fillStyle = P.white; g.fillRect(x + 1, y, 2, 1); g.fillRect(x, y + 1, 3, 1); g.fillRect(x, y + 2, 2, 1);
    g.fillStyle = P.cyan2; g.fillRect(x + 3, y + 1, 1, 1); g.fillRect(x + 2, y + 2, 2, 1); g.fillRect(x + 1, y + 3, 2, 1);
  }

  function say(g, api, s, x, y, col, scale) {
    api.text(g, s, x + 1, y + 1, scale > 1 ? P.mag : INK, scale, 'center');
    api.text(g, s, x, y, col, scale, 'center');
  }

  function drawHud(g, api, t) {
    var s = String(api.score);
    api.text(g, s, 4, 3, P.white);
    if (mult() > 1) api.text(g, 'X' + mult(), 4 + s.length * 6 + 3, 3, P.yel);
    api.text(g, 'LV ' + level, W / 2, 3, P.grey, 1, 'center');
    var x = W - 11;
    for (var i = 0; i < api.lives; i++, x -= 9) {        // spare paddles
      g.fillStyle = P.pink; g.fillRect(x, 5, 7, 3);
      g.fillStyle = '#f8b8d0'; g.fillRect(x + 1, 5, 5, 1);
      g.fillStyle = P.cyan; g.fillRect(x, 5, 1, 3); g.fillRect(x + 6, 5, 1, 3);
    }
    [['W', wideT], ['S', slowT], ['Z', laserT]].forEach(function (e) {   // what's running, blinking as it runs out
      if (e[1] <= 0) return;
      x -= 7;
      if (e[1] >= 2 || Math.floor(t * 8) % 2) api.text(g, e[0], x + 1, 3, RAMP[POW[e[0]].col][1]);
    });
  }

  // ---- the game -----------------------------------------------------------------------------------
  var game = {
    id: 'breakout', title: 'BREAKOUT', w: W, h: H, pal: 'arcadia',
    help: ['MOUSE OR ARROWS MOVE THE PADDLE', 'SPACE OR CLICK LAUNCHES', 'CATCH THE CAPSULES: W M S L Z'],
    coins: { per: 50, best: 20 },

    start: function (api) {
      api.lives = 3; level = 1;
      bits = []; pops = []; sparks = [];
      pad = { x: W / 2, w: baseW() };
      beginLevel(api);
    },

    attract: function (api, dt) {
      if (!bricks || !balls.length || left <= 0) demoSetup(api.t);
      fx(dt);
      var b = balls[0];
      pad.x = clamp(pad.x + clamp((b.stuck ? W / 2 : b.x - aim) - pad.x, -200 * dt, 200 * dt), FX0 + pad.w / 2, FX1 - pad.w / 2);
      if (b.stuck) {
        b.x = pad.x + b.dx; b.y = PY - R;
        if ((demoT -= dt) <= 0) { b.stuck = false; b.vx = 0.4; b.vy = -1; }
        return;
      }
      stepBall(api, b, 125, dt, true);
      if (b.dead) balls = [];
    },

    update: function (api, dt) {
      var fresh = lastMode !== 'play';                   // the press that started or resumed the run doesn't launch
      fx(dt);
      if (deadT > 0) {
        if ((deadT -= dt) <= 0) { trophy(); api.over(); }
        return;
      }
      var go = controls(api, dt, fresh);
      var tw = baseW() + (wideT > 0 ? 18 : 0);         // this wall's width, plus WIDE while it lasts
      pad.w = pad.w < tw ? Math.min(tw, pad.w + 60 * dt) : Math.max(tw, pad.w - 60 * dt);
      pad.x = clamp(pad.x, FX0 + pad.w / 2, FX1 - pad.w / 2);
      if (clearT > 0) {
        if ((clearT -= dt) <= 0) { level++; beginLevel(api); }
        return;
      }
      if (introT > 0) introT -= dt;
      if (launchLock > 0) launchLock -= dt;
      if (wideT > 0) wideT -= dt;
      if (slowT > 0) slowT -= dt;
      var stuck = balls.some(function (b) { return b.stuck; });
      if (go && stuck && launchLock <= 0) { launch(api); stuck = false; go = false; }
      if (laserT > 0) {
        laserT -= dt; laserCool -= dt;
        var hold = api.down(' ') || api.down('Enter') || api.down('z') || api.down('Z') || api.pointer.down;
        if (!fresh && !stuck && laserCool <= 0 && (go || hold)) zap(api);
      }
      // the balls
      var sp = speedNow();
      if (!stuck) { playT += dt; idleT += dt; }
      if (idleT > 9) {                                   // stuck in a loop off steel and walls: nudge it
        idleT = 0;
        balls.forEach(function (b) { if (!b.stuck) { var a = Math.atan2(b.vy, b.vx) + (Math.random() < 0.5 ? -0.2 : 0.2); b.vx = Math.cos(a); b.vy = Math.sin(a); } });
      }
      balls.forEach(function (b) {
        if (b.stuck) { b.x = pad.x + b.dx; b.y = PY - R; return; }
        stepBall(api, b, sp, dt, false);
      });
      balls = balls.filter(function (b) { return !b.dead; });
      // the Zapper's bolts
      bolts.forEach(function (o) {
        for (var k = 0; k < 5 && !o.dead; k++) {
          o.y -= 300 * dt / 5;
          var hit = brickAt(o.x, o.y, 2, 4);
          if (o.y < FY0) o.dead = true;
          else if (hit) { o.dead = true; strike(api, hit, false, false); }
        }
      });
      bolts = bolts.filter(function (o) { return !o.dead; });
      // capsules
      caps.forEach(function (cp) {
        cp.y += 46 * dt;
        if (cp.y + 4 >= PY && cp.y - 4 <= PY + PH && cp.x + 8 >= pad.x - pad.w / 2 && cp.x - 8 <= pad.x + pad.w / 2) { cp.done = true; power(api, cp.type); }
        else if (cp.y > H + 8) cp.done = true;
      });
      caps = caps.filter(function (cp) { return !cp.done; });
      if (left <= 0) { cleared(api); return; }
      if (!balls.length) loseLife(api);
    },

    draw: function (g, api, mode) {
      var t = api.t;
      if (!backdrop) backdrop = paintBackdrop();
      if (!bricks) demoSetup(t);
      g.fillStyle = P.bg; g.fillRect(-4, -4, W + 8, H + 8);
      g.drawImage(backdrop, 0, 0);
      lights.forEach(function (l, i) {                  // windows and aircraft lights, blinking slowly
        if ((Math.floor(t / 2.5 + l[3]) + i) % 5) { g.fillStyle = l[2]; g.fillRect(l[0], l[1], 1, 1); }
      });
      sparks.forEach(function (s) {                     // the neon tube flares where the ball hits a wall
        g.fillStyle = P.white;
        if (s.side === 't') g.fillRect(clamp(s.at - 4, 2, W - 11), 15, 9, 1);
        else g.fillRect(s.side === 'l' ? 2 : W - 3, clamp(s.at - 4, 16, H - 9), 1, 9);
      });
      bricks.forEach(function (br) { drawBrick(g, br, t); });
      caps.forEach(function (cp) { drawCap(g, cp, t); });
      bolts.forEach(function (o) {
        var x = Math.round(o.x), y = Math.round(o.y);
        g.fillStyle = P.yel; g.fillRect(x, y, 2, 4); g.fillStyle = P.white; g.fillRect(x, y, 2, 2);
      });
      if (mode === 'title' || api.lives > 0) drawPaddle(g, t);
      balls.forEach(function (b) { drawBall(g, b); });
      bits.forEach(function (b) { g.fillStyle = b.col; g.fillRect(Math.round(b.x), Math.round(b.y), b.s, b.s); });
      pops.forEach(function (p) { if (p.t > 0.25 || Math.floor(t * 12) % 2) say(g, api, p.s, p.x, Math.round(p.y), p.col, 1); });
      if (mode !== 'title') {
        drawHud(g, api, t);
        if (clearT > 0) {
          say(g, api, 'WALL CLEAR', W / 2, 186, P.cyan2, 2);
        } else if (balls.length && balls[0].stuck && api.lives > 0) {
          if (introT > 0) {
            say(g, api, 'LEVEL ' + level, W / 2, 180, P.cyan2, 2);
            say(g, api, levelName, W / 2, 200, P.pink, 1);
          }
          if (Math.floor(t * 2.5) % 2 === 0) say(g, api, TOUCH ? 'TAP TO LAUNCH' : 'SPACE TO LAUNCH', W / 2, 250, P.white, 1);
        }
      }
      lastMode = mode;
    }
  };

  function fx(dt) {                                    // particles, popups, wall flares, brick flashes
    bits.forEach(function (b) { b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 220 * dt; b.life -= dt; });
    bits = bits.filter(function (b) { return b.life > 0 && b.y < H + 4; });
    pops.forEach(function (p) { p.y -= 16 * dt; p.t -= dt; });
    pops = pops.filter(function (p) { return p.t > 0; });
    sparks.forEach(function (s) { s.t -= dt; });
    sparks = sparks.filter(function (s) { return s.t > 0; });
    bricks.forEach(function (br) { if (br.flash > 0) br.flash -= dt; });
  }

  BridgeArcade.run(game);
})();
</script>
</body>
